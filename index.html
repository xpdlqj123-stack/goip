<!doctype html>
<html lang=ko><head><meta charset=utf-8><meta name="app-ver" content="2026-11-27.16"><meta name="app-notes" content="고입 상담 출력물에 학교별 성적 계산과 합격 예측 결과를 담았습니다. 나이스 안내가 한 번에 펼쳐지고 전화번호일괄등록 버튼을 강조했습니다.">
<meta name=viewport content="width=device-width,initial-scale=1">
<title>고입 도우미</title>
<style>

*{box-sizing:border-box}
:root{
 --bg:#eceff4; --sf:#ffffff; --fg:#111827; --mu:#5b6676; --ln:#cbd5e1; --ln2:#94a3b8;
 --pri:#1d4ed8; --live:#ea580c; --wait:#7c3aed; --soon:#1d4ed8; --end:#6b7280;
 --pop:#f2f8ff; --popln:#1d4ed8;
 --r:10px;
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;font-size:16.8px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:1680px;margin:0 auto;padding:0 20px 80px}
a{color:var(--pri)}
.mu{color:var(--mu)}
.sm{font-size:14.6px}
.xs{font-size:13.4px}
b.hb{color:#1d4ed8;font-weight:800}
b.hr{color:#c81e1e;font-weight:800}
b.hk{font-weight:800}

/* header */
.hd{position:sticky;top:0;z-index:40;background:#0f2a4d;color:#fff}
.hd .in{max-width:1680px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hd .ti{font-weight:800;font-size:16.8px;letter-spacing:-.2px}
.hd .sp{flex:1}
.hd .dt{font-size:21.3px;font-weight:800;color:#fff;letter-spacing:-.3px}
.dt.pv{color:#ffd8a8}
.dtb{font:inherit;font-size:13.4px;font-weight:700;color:#b9cce6;background:transparent;border:1px solid #4a6a99;border-radius:6px;padding:2px 8px;margin-left:8px;cursor:pointer}
.dtb:hover{background:#1b3e6e}
.dti{font:inherit;font-size:14.6px;margin-left:8px;border:1px solid #4a6a99;border-radius:6px;padding:2px 6px;background:#fff;color:#0f2a4d}
.nv{display:flex;gap:6px}
.nv button{font:inherit;font-size:15.1px;font-weight:700;color:#d7e4f5;background:transparent;border:1px solid #3c5a85;border-radius:8px;padding:6px 12px;cursor:pointer}
.nv button.on{background:#fff;color:#0f2a4d;border-color:#fff}

/* cover */
.cov{max-width:860px;margin:0 auto;padding:54px 0 0;text-align:center}
.cov .eyebrow{display:inline-block;font-size:14px;font-weight:700;color:var(--pri);background:#e3edff;border:1px solid #c3d8ff;border-radius:999px;padding:5px 13px}
.cov h1{font-size:44.8px;line-height:1.22;margin:18px 0 10px;letter-spacing:-1px;font-weight:800}
.cov p{color:var(--mu);font-size:16.8px;margin:0 auto;max-width:560px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:30px 0 0}
.hero .go{display:block;text-align:left;background:var(--sf);border:2px solid var(--ln2);border-radius:14px;padding:20px 20px 18px;cursor:pointer;font:inherit;color:inherit}
.hero .go:hover{border-color:var(--pri)}
.hero .go .n{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:#0f2a4d;color:#fff;font-size:14.6px;font-weight:800}
.hero .go .t{font-size:23.5px;font-weight:800;margin:11px 0 5px;letter-spacing:-.4px}
.hero .go .s{font-size:14.6px;color:var(--mu);line-height:1.45}
.hero .go .k{margin-top:12px;font-size:14px;font-weight:700;color:var(--pri)}
.cov .note{margin-top:22px;font-size:14px;color:var(--mu);border-top:1px solid var(--ln);padding-top:14px;text-align:left}

/* generic card/panel */
.pn{background:var(--sf);border:1px solid var(--ln2);border-radius:var(--r)}
.ph{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ln2);background:#f4f7fb;border-radius:var(--r) var(--r) 0 0}
.ph h3{margin:0;font-size:16.8px;font-weight:800}
.pb{padding:14px}
h2.sec{font-size:24.6px;font-weight:800;margin:26px 0 4px;letter-spacing:-.5px}
.subt{color:var(--mu);font-size:14.6px;margin-bottom:12px}
.btn{font:inherit;font-size:15.1px;font-weight:700;border-radius:8px;padding:7px 13px;cursor:pointer;border:1px solid var(--ln2);background:#fff;color:var(--fg)}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.p:hover{background:#1740b4;color:#fff}
.btn.sm{font-size:14px;padding:5px 10px}
.btn.dg{color:#b42318;border-color:#e6b4ae}

/* roster: left upload / right table */
.rs{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start;margin-top:12px}
.rs .l{position:sticky;top:60px}
.drop{border:2px dashed var(--ln2);border-radius:10px;background:#f8fafc;padding:18px 14px;text-align:center}
.drop.hov{border-color:var(--pri);background:#eaf1ff}
.drop .ic{font-size:23.5px;font-weight:800;color:var(--pri)}
.drop .t{font-size:16.2px;font-weight:800;margin:6px 0 3px}
.drop .s{font-size:13.4px;color:var(--mu)}
.fold{margin-top:10px;border-top:1px solid var(--ln);padding-top:10px}
.fold>button{width:100%;text-align:left;font:inherit;font-size:15.1px;font-weight:700;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--fg)}
.fold .bd{display:none;padding:8px 0 2px}
.fold.open .bd{display:block}
textarea,input.inp{font:inherit;font-size:15.1px;width:100%;border:1px solid var(--ln2);border-radius:7px;padding:7px 9px;background:#fff;color:var(--fg)}
textarea{min-height:92px;resize:vertical}
.msg{margin-top:10px;font-size:14.6px;border-radius:8px;padding:9px 11px;border:1px solid}
.msg.ok{background:#eafaf0;border-color:#9ddcb6;color:#15643a}
.msg.er{background:#fdeeec;border-color:#eeb4ac;color:#9b1c13}

/* student table with strong lines */
table.tb{width:100%;border-collapse:collapse;background:#fff;border:2px solid var(--ln2)}
table.tb th,table.tb td{border:1px solid var(--ln2);padding:8px 10px;text-align:left;vertical-align:middle}
table.tb thead th{background:#dde6f1;font-size:14.6px;font-weight:800;color:#1f3350;position:sticky;top:52px;z-index:5}
table.tb tbody tr:nth-child(even) td{background:#fafcfe}
table.tb td.no{text-align:center;font-weight:800;width:46px;padding:8px 4px;font-variant-numeric:tabular-nums}
table.tb td.nm{font-weight:700;width:78px;white-space:nowrap;padding:8px 6px}
table.tb td.act{width:28px;text-align:center;padding:8px 2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln2);border-radius:7px;padding:3px 6px 3px 0;font-size:14px;background:#fff;overflow:hidden}
.chip .ty{font-size:12.3px;font-weight:800;color:#fff;padding:3px 6px;border-radius:5px 0 0 5px}
.chip .nm2{font-weight:700}
.chip .x{border:0;background:none;font:inherit;cursor:pointer;color:var(--mu);padding:0 2px;font-size:14.6px}
.chip .x:hover{color:#b42318}
.t1{background:#0f766e}.t2{background:#1d4ed8}.t3{background:#7c3aed}.t4{background:#ea580c}
.t5{background:#be185d}.t6{background:#0369a1}.t7{background:#4338ca}.t8{background:#15803d}
.tf1{color:#0f766e}.tf2{color:#1d4ed8}.tf3{color:#7c3aed}.tf4{color:#ea580c}
.tf5{color:#be185d}.tf6{color:#0369a1}.tf7{color:#4338ca}.tf8{color:#15803d}.tf9{color:#7c3aed}.t9{background:#7c3aed}.pgrp.g3{background:#f3eefe;border-color:#d9c9f7}

/* modal popup */
.ov{position:fixed;inset:0;background:rgba(10,22,40,.62);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;overflow:auto}
.pop{width:100%;max-width:880px;background:var(--pop);border:2px solid var(--popln);border-radius:14px;box-shadow:0 18px 50px rgba(8,22,45,.35);overflow:hidden}
.pop .pbar{background:var(--popln);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.pop .pbar .t{font-size:18.5px;font-weight:800}
.pop .pbar .s{font-size:14px;color:#d6e4ff}
.pop .pbar .sp{flex:1}
.pop .pbar button{font:inherit;font-size:14.6px;font-weight:700;background:#fff;color:var(--popln);border:0;border-radius:7px;padding:6px 12px;cursor:pointer}
.pop .pbd{padding:14px 16px 18px;max-height:min(70vh,620px);overflow:auto}
.pop .gt{font-size:14px;font-weight:800;color:#0f2a4d;background:#dbe8fb;border:1px solid #b6cff3;border-radius:6px;padding:4px 9px;display:inline-block;margin:14px 0 8px}
.pop .gt:first-child{margin-top:0}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pk button{font:inherit;text-align:left;background:#fff;border:1.5px solid var(--ln2);border-radius:9px;padding:9px 11px;cursor:pointer;color:inherit;display:flex;gap:8px;align-items:center}
.pk button:hover{border-color:var(--popln)}
.pk button.on{border-color:var(--popln);background:#e5effd;box-shadow:inset 0 0 0 1px var(--popln)}
.pk .dot{width:9px;height:9px;border-radius:50%;flex:none}
.pk .l1{font-size:16.2px;font-weight:800;line-height:1.25}
.pk .l2{font-size:12.9px;font-weight:700;margin-top:2px}
.pk .ck{margin-left:auto;font-weight:900;color:var(--popln);font-size:16.8px}

/* school list */
.pgrp{border-radius:12px;padding:10px 14px 14px;margin-bottom:14px}
.pgrp.g1{background:#e3eeff;border:1px solid #a9c8f5}
.pgrp.g2{background:#fff0dc;border:1px solid #efc891}
.pgrp .gt{display:inline-block;color:#fff;border-radius:7px;padding:3px 14px;margin:2px 0 6px;font-size:15.7px;font-weight:800;letter-spacing:0}
.pgrp.g1 .gt{background:#1f5fbf}.pgrp.g2 .gt{background:#c2680a}.pgrp.g3 .gt{background:#7c3aed}
.grp{margin-top:28px}
.grp .gh{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid #0f2a4d;padding-bottom:7px}
.grp .gh h2{margin:0;font-size:26.9px;font-weight:800;letter-spacing:-.6px}
.tyrow{margin-top:18px}
.tyrow .tyh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tyrow .tyh .bar{width:4px;height:17px;border-radius:2px}
.tyrow .tyh .nm3{font-size:18.5px;font-weight:800;letter-spacing:-.3px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--ln2);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;display:block}
.card:hover{border-color:var(--pri)}
.card .tp{height:5px}
.card .bd{padding:12px 13px 13px}
.card .n4{font-size:20.2px;font-weight:800;letter-spacing:-.5px;margin:7px 0 9px;line-height:1.25}
.kv{display:flex;gap:8px;font-size:15.1px;padding:3px 0}
.kv .k{color:var(--mu);width:44px;flex:none;font-size:14px;font-weight:700;padding-top:1px}
.kv .v{font-weight:700;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13.4px;font-weight:800;border-radius:6px;padding:3px 8px;border:1px solid}
.badge .pt{width:7px;height:7px;border-radius:50%;background:currentColor}
.b-live{color:#9a3412;background:#ffedd5;border-color:#fdba74}
.b-live .pt{animation:bk 1s steps(1,end) infinite}
@keyframes bk{0%,49%{opacity:1}50%,100%{opacity:.08}}
.b-wait,.b-ann{color:#5b21b6;background:#f3e8ff;border-color:#d8b4fe}
.b-recv{color:#166534;background:#dcfce7;border-color:#86efac}
.b-add{color:#9d174d;background:#fce7f3;border-color:#f9a8d4}
.fl button.bigtab{font-size:19px;font-weight:800;padding:9px 22px}
.mfl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.mfl button{font:inherit;font-size:15.1px;font-weight:700;padding:6px 13px;border-radius:999px;border:1px solid var(--ln2);background:#fff;color:var(--fg);cursor:pointer}
.mfl button.on{background:#0f2a4d;border-color:#0f2a4d;color:#fff}
.mfl button .c{opacity:.7;margin-left:4px;font-weight:800}
.b-live,.b-recv,.b-ann,.b-add{animation:bdgbk 1.3s ease-in-out infinite}
@keyframes bdgbk{0%,100%{opacity:1}50%{opacity:.35}}
.b-soon{color:#1e40af;background:#dbeafe;border-color:#93c5fd}
.b-end{color:#374151;background:#eef1f4;border-color:#cbd5e1}
.card.live{border-color:var(--live);box-shadow:inset 0 0 0 1px var(--live)}
.dn-{font-size:13.4px;font-weight:800;color:#b42318;margin-left:4px}
.stu{margin-top:10px;border-top:1px dashed var(--ln2);padding-top:9px}
.stu .lb{font-size:12.9px;font-weight:700;color:var(--mu);margin-bottom:5px}
.sch{display:inline-block;font-size:13.4px;font-weight:700;background:#eef3fa;border:1px solid #cdd9ea;border-radius:6px;padding:2px 7px;margin:0 4px 4px 0}
.sch i{font-style:normal;color:var(--pri);font-weight:800}
.none{font-size:14px;color:#9aa4b2}
/* split card (특별/일반 가로 구분) */
.sp2{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;border-top:1px solid var(--ln2)}
.sp2>button{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;font:inherit;color:inherit;text-align:left;background:none;border:0;border-left:1px solid var(--ln2);padding:12px 13px 13px;cursor:pointer}
.sp2>button:first-child{border-left:0}
.sp2>button:hover{background:#f3f7ff}
.sp2 .lab{font-size:16.2px;font-weight:800;margin:7px 0 7px}
.sp2>button>.badge{align-self:flex-start}
.sp2>button .kv{min-height:26px}
.cardw{background:var(--sf);border:1px solid var(--ln2);border-radius:var(--r);overflow:hidden}
.cardw .hd2{padding:11px 13px;display:flex;align-items:center;gap:9px;background:#f4f7fb}
.cardw .hd2 .n4{font-size:20.2px;font-weight:800;letter-spacing:-.5px;margin:0}
.card.ann,.cardw.ann{border:2px solid #d92d20;box-shadow:0 0 0 3px #fecaca;background:#fff5f5}
.sp2>button.ann{background:#ffe4e4}
.annp{display:inline-block;background:#d92d20;color:#fff;font-size:14.6px;font-weight:800;border-radius:6px;padding:2px 8px;margin-left:6px;animation:annp 1.6s ease-in-out infinite}
@keyframes annp{0%,100%{opacity:1}50%{opacity:.65}}
.annb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 4px;padding:11px 14px;border-radius:10px;background:#d92d20;color:#fff}
.annb b{font-size:19px;margin-right:4px}
.tdy{font-size:15.7px;font-weight:800;color:#d92d20;margin:2px 0 7px;line-height:1.35}
.tdy.ph{visibility:hidden}
.annc{font:inherit;font-size:15.1px;font-weight:800;border:0;border-radius:999px;padding:5px 12px;background:#fff;color:#b42318;cursor:pointer}
.cardw.live{border-color:var(--live);box-shadow:inset 0 0 0 1px var(--live)}

/* filters */
.fl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:14px 0 2px}
.fl button{font:inherit;font-size:14.6px;font-weight:700;border:1px solid var(--ln2);background:#fff;border-radius:999px;padding:6px 13px;cursor:pointer;color:var(--fg)}
.fl button.on{background:#0f2a4d;border-color:#0f2a4d;color:#fff}
.fl input{font:inherit;font-size:14.6px;border:1px solid var(--ln2);border-radius:8px;padding:6px 10px;min-width:150px;background:#fff;color:var(--fg)}

/* detail */
.det{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start;margin-top:14px}
.det .sd{position:sticky;top:60px}
.dn{width:84px;height:84px;display:block}
.dnb{fill:none;stroke:#e2e8f0;stroke-width:3.4}
.dnf{fill:none;stroke:var(--pri);stroke-width:3.4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.dnt{font-size:9.6px;font-weight:800;text-anchor:middle;fill:var(--fg)}
.stp{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.stp button{font:inherit;font-size:14.6px;text-align:left;background:#fff;border:1px solid var(--ln);border-radius:8px;padding:7px 9px;cursor:pointer;display:flex;gap:7px;align-items:center;color:inherit}
.stp button .i{width:19px;height:19px;border-radius:50%;background:#eef1f5;color:#56637a;font-size:12.3px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.stp button.d .i{background:#15803d;color:#fff}
.stp button.c{border-color:var(--live);background:#fff7ed}
.stp button.c .i{background:var(--live);color:#fff}
.stp button.w .i{background:#c81e1e;color:#fff}
.stg{background:var(--sf);border:1px solid var(--ln2);border-radius:var(--r);margin-bottom:11px;overflow:hidden}
.stg.now{border:2px solid #e8590c;animation:nowb 1.5s ease-in-out infinite}
.stg.now>.sh{background:#fff0dc}
.nowp{display:inline-block;background:#e8590c;color:#fff;font-size:13.4px;font-weight:800;border-radius:6px;padding:2px 8px;margin-left:6px;animation:annp 1.2s ease-in-out infinite}
@keyframes nowb{0%,100%{box-shadow:0 0 0 0 rgba(232,89,12,.55)}50%{box-shadow:0 0 0 6px rgba(232,89,12,.12)}}
.stg.cur{border-color:var(--live);box-shadow:inset 0 0 0 1px var(--live)}
.stg>.sh{width:100%;display:flex;align-items:center;gap:11px;padding:12px 14px;background:#f6f8fb;border:0;border-bottom:1px solid var(--ln2);cursor:pointer;font:inherit;color:inherit;text-align:left}
.stg>.sh .num{width:25px;height:25px;border-radius:50%;background:#0f2a4d;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.stg>.sh .tt{font-size:19px;font-weight:800;letter-spacing:-.4px}
.stg>.sh .dt2{font-size:14px;color:var(--mu);font-weight:700}
.stg>.sh .cnt{margin-left:auto;font-size:14px;font-weight:800;color:var(--mu);font-variant-numeric:tabular-nums}
.stg .sb{padding:13px 14px 16px;display:none}
.stg.open .sb{display:block}
.lbl{font-size:13.4px;font-weight:800;color:#0f2a4d;background:#e8eef7;border-radius:5px;padding:3px 8px;display:inline-block;margin:0 0 9px}
.todo{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:8px}
.it{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--ln);border-radius:9px;padding:10px 11px;background:#fff;cursor:pointer}
.it:hover{border-color:var(--pri)}
.it.on{background:#f3faf5;border-color:#a7dcb9}
.it .bx{width:21px;height:21px;border:2px solid var(--ln2);border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14.6px;font-weight:900;color:#fff;background:#fff;margin-top:1px}
.it.on .bx{background:#15803d;border-color:#15803d}
.it .tx{font-size:16.8px;font-weight:600;line-height:1.45}
.it.on .tx{color:#60708a;text-decoration:line-through}
.it .no2{font-size:12.9px;font-weight:800;color:var(--mu);margin-right:3px}
.cf{margin-top:11px;border:1px dashed var(--ln2);border-radius:9px;background:#fafbfd;padding:10px 12px}
.cf li{font-size:14.6px;color:#46536b;margin:3px 0}
.nt{margin-top:11px;border:1px solid #f0cf9a;background:#fffaf0;border-radius:9px;padding:10px 12px}
.nt li{font-size:14.6px;color:#6b4a10;margin:3px 0}
ul.cl{margin:0;padding-left:17px}
/* student grid */
.sgw{margin-top:12px;overflow:auto;border:2px solid var(--ln2);border-radius:8px;background:#fff}
table.sg{border-collapse:collapse;width:100%;min-width:420px}
table.sg th,table.sg td{border:1px solid var(--ln2);padding:5px 7px;font-size:14.6px;text-align:center}
table.sg thead th{background:#dde6f1;font-weight:800;cursor:pointer;font-size:14px}
table.sg th.nmh{text-align:left;min-width:104px;background:#dde6f1}
table.sg td.nmc{text-align:left;font-weight:700;white-space:nowrap;background:#f7fafd}
table.sg td.c{cursor:pointer;width:40px;font-weight:900;color:#c3ccd8;font-size:16.8px}

 D:2, E:1 },\\n      tracks: [\\n        {\\n          id:'general', label:'일반전형', shortPt:'150+30+20',\\n          academicMax:150, semesterCaps:[45,45,60],\\n          attendance:{ mode:'deduction', max:30 },\\n          service:{ max:20, table:[\\n            {min:30,score:20},{min:24,score:18},{min:18,score:16},{min:12,score:14},{min:6,score:12},{min:0,score:10} ] },\\n          bonus:null,\\n        },\\n        {\\n          id:'special', label:'특별전형', shortPt:'90+60+50',\\n          academicMax:90, semesterCaps:[27,27,36],\\n          attendance:{ mode:'deduction', max:60 },\\n          service:{ max:50, table:[\\n            {min:30,score:50},{min:24,score:45},{min:18,score:40},{min:12,score:35},{min:6,score:30},{min:0,score:25} ] },\\n          bonus:null,\\n        },\\n      ],\\n      stage2Note: '1차(서류) 성적 이후 2차 전형(심층면접 30점 + 마이스터 인·적성 소양검사 70점, 두 전형 동일)을 더해 300점 만점으로 최종 합격자를 선발해요. 이 계산기는 학생부로 산출되는 1차 서류 점수만 계산합니다. 봉사활동 점수는 2026학년도 졸업예정자 기준표를 사용했어요.',\\n      footer: '한국원자력마이스터고등학교 2027학년도 입학전형 요강을 바탕으로 제작했습니다.',\\n    },\\n  ];\\n\\n  let currentSchool = SCHOOLS[0];\\n  let currentTrack = currentSchool.tracks[0];\\n  const state = { trackBy:{}, grades:{}, absDays:0, lateEtc:0, serviceHours:0, bonus:{} };\\n\\n  function cellKey(subjKey, semKey){ return subjKey + '|' + semKey; }\\n  function resetState(){\\n    state.grades = {}; state.absDays = 0; state.lateEtc = 0; state.serviceHours = 0; state.bonus = {};\\n  }\\n\\n  // ------------------------------------------------------------------\\n  // 학교 pill / 전형 탭\\n  // ------------------------------------------------------------------\\n  const pillsWrap = document.getElementById('schoolPills');\\n  function renderPills(){\\n    pillsWrap.innerHTML = '';\\n    SCHOOLS.forEach(s=>{\\n      const p = document.createElement('div');\\n      p.className = 'school-pill' + (s.id===currentSchool.id ? ' active' : '');\\n      p.textContent = s.name;\\n      p.onclick = ()=>{ currentSchool = s; currentTrack = s.tracks.find(t=>t.id===state.trackBy[s.id]) || s.tracks[0]; init(); };\\n      pillsWrap.appendChild(p);\\n    });\\n    const more = document.createElement('div');\\n    more.className = 'school-pill disabled';\\n    more.textContent = '+ 다른 학교 추가 예정';\\n    pillsWrap.appendChild(more);\\n  }\\n\\n  function renderTrackArea(){\\n    const area = document.getElementById('trackArea');\\n    area.innerHTML = '';\\n    if(currentSchool.tracks.length <= 1) return;\\n    const row = document.createElement('div');\\n    row.className = 'track-row';\\n    currentSchool.tracks.forEach(t=>{\\n      const b = document.createElement('div');\\n      b.className = 'track-btn' + (t.id===currentTrack.id ? ' active' : '');\\n      b.innerHTML = t.label + '<span class=\\\"pt\\\">' + t.shortPt + '점<\\/span>';\\n      b.onclick = ()=>{ currentTrack = t; state.trackBy[currentSchool.id] = t.id; renderAll(); };\\n      row.appendChild(b);\\n    });\\n    area.appendChild(row);\\n  }\\n\\n  // ------------------------------------------------------------------\\n  // 교과 성적 입력 테이블\\n  // ------------------------------------------------------------------\\n  function renderTable(){\\n    document.getElementById('tableTitle').textContent = '교과 성적 입력 (' + currentTrack.academicMax + '점)';\\n    document.getElementById('tableSub').textContent = '과목별로 각 학기의 성취도(A~E)를 선택하세요. 입력하지 않은 칸은 계산에서 제외돼요.';\\n    const table = document.getElementById('scoreTable');\\n    table.innerHTML = '';\\n\\n    const thead = document.createElement('thead');\\n    const headRow = document.createElement('tr');\\n    headRow.innerHTML = '<th style=\\\"text-align:left;\\\">과목<\\/th>' +\\n      currentSchool.semesters.map(sem=>'<th>'+sem.label+'<\\/th>').join('');\\n    thead.appendChild(headRow);\\n\\n    if(currentSchool.engine === 'absolute'){\\n      const weightRow = document.createElement('tr');\\n      weightRow.className = 'weights';\\n      weightRow.innerHTML = '<th style=\\\"text-align:left;\\\">학기 반영비율<\\/th>' +\\n        currentSchool.semesters.map(sem=>'<th>'+Math.round(sem.weight*100)+'%<\\/th>').join('');\\n      thead.appendChild(weightRow);\\n    } else {\\n      const capRow = document.createElement('tr');\\n      capRow.className = 'weights';\\n      capRow.innerHTML = '<th style=\\\"text-align:left;\\\">학기 배점<\\/th>' +\\n        currentTrack.semesterCaps.map(c=>'<th>'+(Math.round(c*10)/10)+'점<\\/th>').join('');\\n      thead.appendChild(capRow);\\n    }\\n    table.appendChild(thead);\\n\\n    const tbody = document.createElement('tbody');\\n    currentSchool.subjects.forEach(subj=>{\\n      const tr = document.createElement('tr');\\n      const labelTd = document.createElement('td');\\n      labelTd.className = 'subj-label';\\n      const wLabel = currentSchool.engine === 'absolute'\\n        ? '비중 ' + Math.round(subj.weight*100) + '%'\\n        : '가중치 ' + subj.weight;\\n      labelTd.innerHTML = subj.label + '<span class=\\\"w\\\">'+wLabel+'<\\/span>';\\n      tr.appendChild(labelTd);\\n\\n      currentSchool.semesters.forEach(sem=>{\\n        const td = document.createElement('td');\\n        const sel = document.createElement('select');\\n        sel.dataset.subj = subj.key;\\n        sel.dataset.sem = sem.key;\\n        ['', 'A', 'B', 'C', 'D', 'E'].forEach(o=>{\\n          const opt = document.createElement('option');\\n          opt.value = o;\\n          opt.textContent = o === '' ? '－' : o;\\n          sel.appendChild(opt);\\n        });\\n        const k = cellKey(subj.key, sem.key);\\n        sel.value = state.grades[k] || '';\\n        sel.className = sel.value === '' ? 'empty' : '';\\n        sel.addEventListener('change', (e)=>{\\n          state.grades[k] = e.target.value;\\n          e.target.className = e.target.value === '' ? 'empty' : '';\\n          calc();\\n        });\\n        td.appendChild(sel);\\n        tr.appendChild(td);\\n      });\\n      tbody.appendChild(tr);\\n    });\\n    table.appendChild(tbody);\\n\\n    const noteSubj = currentSchool.subjects.find(s=>s.note);\\n    document.getElementById('socNote').textContent = noteSubj ? '※ ' + noteSubj.note : '';\\n  }\\n\\n  // ------------------------------------------------------------------\\n  // 출결 입력\\n  // ------------------------------------------------------------------\\n  function renderAttendance(){\\n    const att = currentTrack.attendance;\\n    document.getElementById('attTitle').textContent = '출결 점수 (' + att.max + '점)';\\n    const wrap = document.getElementById('attInputs');\\n    wrap.innerHTML = '';\\n\\n    if(att.mode === 'deduction'){\\n      document.getElementById('attSub').textContent = '질병·학교장 인정 결석은 제외하고, 미인정(무단) 결석·지각·조퇴·결과 횟수를 입력하세요. 결석 1회당 '+(att.perAbs||10)+'점, 지각·조퇴·결과 1회당 '+(att.perOther||5)+'점이 만점에서 차감돼요.';\\n      wrap.innerHTML =\\n        '<div class=\\\"field\\\"><label for=\\\"absDays\\\">미인정 결석 횟수(일)<\\/label>' +\\n        '<input type=\\\"number\\\" id=\\\"absDays\\\" min=\\\"0\\\" value=\\\"'+state.absDays+'\\\"><p class=\\\"hint\\\">질병·학교장 인정 결석은 제외<\\/p><\\/div>' +\\n        '<div class=\\\"field\\\"><label for=\\\"lateEtc\\\">미인정 지각·조퇴·결과 합계(회)<\\/label>' +\\n        '<input type=\\\"number\\\" id=\\\"lateEtc\\\" min=\\\"0\\\" value=\\\"'+state.lateEtc+'\\\"><p class=\\\"hint\\\">3회 환산 없이 1회당 그대로 차감<\\/p><\\/div>';\\n      document.getElementById('attResultLabel').textContent = '차감 점수';\\n    } else {\\n      document.getElementById('attSub').textContent = '질병·학교장 인정 결석은 제외하고, 미인정(무단) 결석·지각·조퇴·결과만 입력하세요.';\\n      wrap.innerHTML =\\n        '<div class=\\\"field\\\"><label for=\\\"absDays\\\">미인정 결석일수<\\/label>' +\\n        '<input type=\\\"number\\\" id=\\\"absDays\\\" min=\\\"0\\\" value=\\\"'+state.absDays+'\\\"><p class=\\\"hint\\\">질병·학교장 인정 결석은 제외<\\/p><\\/div>' +\\n        '<div class=\\\"field\\\"><label for=\\\"lateEtc\\\">미인정 지각·조퇴·결과 합계 (회)<\\/label>' +\\n        '<input type=\\\"number\\\" id=\\\"lateEtc\\\" min=\\\"0\\\" value=\\\"'+state.lateEtc+'\\\"><p class=\\\"hint\\\">3회당 결석 1일로 환산 (2회 이하는 버림)<\\/p><\\/div>';\\n      document.getElementById('attResultLabel').innerHTML = '환산 결석일수 <b id=\\\"totalAbsDays\\\">0일<\\/b>';\\n    }\\n    document.getElementById('absDays').addEventListener('input', (e)=>{ state.absDays = parseInt(e.target.value,10)||0; calc(); });\\n    document.getElementById('lateEtc').addEventListener('input', (e)=>{ state.lateEtc = parseInt(e.target.value,10)||0; calc(); });\\n  }\\n\\n  function calcAttendance(){\\n    const att = currentTrack.attendance;\\n    const absCount = Math.max(0, state.absDays || 0);\\n    const lateEtc = Math.max(0, state.lateEtc || 0);\\n\\n    if(att.mode === 'deduction'){\\n      const score = Math.max(0, att.max - absCount*(att.perAbs||10) - lateEtc*(att.perOther||5));\\n      document.getElementById('attResultLabel').textContent = '차감 점수 ' + (att.max-score) + '점';\\n      document.getElementById('attScoreOut').textContent = score + '점';\\n      return score;\\n    }\\n\\n    const convertedDays = Math.floor(lateEtc / 3);\\n    const totalDays = absCount + convertedDays;\\n    let score = 0;\\n    for(const row of att.table){ if(totalDays <= row.maxDays){ score = row.score; break; } }\\n    document.getElementById('attResultLabel').innerHTML = '환산 결석일수 <b>' + totalDays + '일<\\/b>';\\n    document.getElementById('attScoreOut').textContent = score + '점';\\n    return score;\\n  }\\n\\n  // ------------------------------------------------------------------\\n  // 봉사활동\\n  // ------------------------------------------------------------------\\n  function renderService(){\\n    const card = document.getElementById('serviceCard');\\n    const svc = currentTrack.service;\\n    if(!svc){ card.style.display='none'; return; }\\n    card.style.display = '';\\n    document.getElementById('serviceSub').textContent = '3개 학년(내신 성적 작성 기준일까지) 봉사활동 시간 합계를 입력하세요. 최대 ' + svc.max + '점.';\\n    const input = document.getElementById('serviceHours');\\n    input.value = state.serviceHours;\\n    input.oninput = (e)=>{ state.serviceHours = parseFloat(e.target.value)||0; calc(); };\\n  }\\n  function calcService(){\\n    const svc = currentTrack.service;\\n    if(!svc) return 0;\\n    const hours = Math.max(0, state.serviceHours || 0);\\n    let score = 0;\\n    for(const row of svc.table){ if(hours >= row.min){ score = row.score; break; } }\\n    document.getElementById('serviceScoreOut').textContent = score + '점';\\n    return score;\\n  }\\n\\n  // ------------------------------------------------------------------\\n  // 가산점\\n  // ------------------------------------------------------------------\\n  function renderBonus(){\\n    const card = document.getElementById('bonusCard');\\n    const bonus = currentTrack.bonus;\\n    if(!bonus){ card.style.display='none'; return; }\\n    card.style.display = '';\\n    document.getElementById('bonusSub').textContent = '최대 ' + bonus.max + '점.';\\n    const wrap = document.getElementById('bonusInputs');\\n    wrap.innerHTML = '';\\n    if(bonus.type === 'select'){\\n      bonus.items.forEach(item=>{\\n        const f = document.createElement('div');\\n        f.className = 'field';\\n        f.style.marginBottom = '10px';\\n        const sel = document.createElement('select');\\n        item.options.forEach(o=>{\\n          const opt = document.createElement('option');\\n          opt.value = o.v; opt.textContent = o.l;\\n          sel.appendChild(opt);\\n        });\\n        sel.value = state.bonus[item.key] ?? 0;\\n        sel.addEventListener('change', (e)=>{ state.bonus[item.key] = parseInt(e.target.value,10); calc(); });\\n        const label = document.createElement('label');\\n        label.textContent = item.label;\\n        f.appendChild(label); f.appendChild(sel);\\n        wrap.appendChild(f);\\n      });\\n    } else {\\n      bonus.items.forEach(item=>{\\n        const row = document.createElement('div');\\n        row.className = 'check-row';\\n        const cb = document.createElement('input');\\n        cb.type = 'checkbox'; cb.id = 'bonus_'+item.key;\\n        cb.checked = !!state.bonus[item.key];\\n        cb.addEventListener('change', (e)=>{ state.bonus[item.key] = e.target.checked ? item.value : 0; calc(); });\\n        const label = document.createElement('label');\\n        label.setAttribute('for','bonus_'+item.key);\\n        label.innerHTML = item.label + ' <span class=\\\"pt\\\">(+'+item.value+'점)<\\/span>';\\n        row.appendChild(cb); row.appendChild(label);\\n        wrap.appendChild(row);\\n      });\\n    }\\n  }\\n  function calcBonus(){\\n    const bonus = currentTrack.bonus;\\n    if(!bonus) return 0;\\n    let sum = 0;\\n    bonus.items.forEach(item=>{ sum += state.bonus[item.key] || 0; });\\n    sum = Math.min(sum, bonus.max);\\n    document.getElementById('bonusScoreOut').textContent = sum + '점';\\n    return sum;\\n  }\\n\\n  // ------------------------------------------------------------------\\n  // 교과 성적 계산\\n  // ------------------------------------------------------------------\\n  function calcAcademic(){\\n    let total = 0, filled = 0;\\n    const detailRows = [];\\n    const totalCells = currentSchool.subjects.length * currentSchool.semesters.length;\\n\\n    if(currentSchool.engine === 'absolute'){\\n      currentSchool.semesters.forEach(sem=>{\\n        currentSchool.subjects.forEach(subj=>{\\n          const g = state.grades[cellKey(subj.key, sem.key)];\\n          let pts = 0;\\n          if(g){ pts = currentSchool.gradeScore[g] * sem.weight * subj.weight; filled++; }\\n          total += pts;\\n          detailRows.push({ sem: sem.label, subj: subj.label, grade: g || '－', pts });\\n        });\\n      });\\n    } else {\\n      currentSchool.semesters.forEach((sem, i)=>{\\n        const cap = currentTrack.semesterCaps[i];\\n        let num = 0, den = 0;\\n        const rowsThisSem = [];\\n        currentSchool.subjects.forEach(subj=>{\\n          const g = state.grades[cellKey(subj.key, sem.key)];\\n          if(g){\\n            num += currentSchool.gradeScore[g] * subj.weight;\\n            den += 5 * subj.weight;\\n            filled++;\\n          }\\n          rowsThisSem.push({ subj, g });\\n        });\\n        const semScore = den > 0 ? (num/den) * cap : 0;\\n        total += semScore;\\n        // 개별 과목 기여도는 학기 점수를 비중대로 배분해 참고용으로 표시\\n        rowsThisSem.forEach(r=>{\\n          const g = r.g;\\n          const pts = (g && den>0) ? (currentSchool.gradeScore[g]*r.subj.weight/den)*cap : 0;\\n          detailRows.push({ sem: sem.label, subj: r.subj.label, grade: g || '－', pts });\\n        });\\n      });\\n    }\\n    document.getElementById('filledCount').textContent = filled;\\n    document.getElementById('filledMax').textContent = totalCells;\\n    return { total, detailRows };\\n  }\\n\\n  // ------------------------------------------------------------------\\n  // 종합 계산 / 렌더\\n  // ------------------------------------------------------------------\\n  function calc(){\\n    const { total: academicTotal, detailRows } = calcAcademic();\\n    const attScore = calcAttendance();\\n    const serviceScore = calcService();\\n    const bonusScore = calcBonus();\\n\\n    const academicMax = currentTrack.academicMax;\\n    const attMax = currentTrack.attendance.max;\\n    const serviceMax = currentTrack.service ? currentTrack.service.max : 0;\\n    const bonusMax = currentTrack.bonus ? currentTrack.bonus.max : 0;\\n    const maxTotal = academicMax + attMax + serviceMax + bonusMax;\\n    const total = academicTotal + attScore + serviceScore + bonusScore;\\n\\n    document.getElementById('totalScore').textContent = total.toFixed(1);\\n    document.getElementById('totalMax').textContent = '/ ' + maxTotal + '점';\\n    document.getElementById('gaugeFill').style.width = Math.min(100, (total/maxTotal)*100) + '%';\\n    const ticks = document.getElementById('gaugeTicks');\\n    ticks.innerHTML = '<span>0<\\/span><span>'+Math.round(maxTotal/2)+'<\\/span><span>'+maxTotal+'<\\/span>';\\n\\n    const subRow = document.getElementById('subscoreRow');\\n    let subHtml = '<div class=\\\"subscore\\\"><div class=\\\"t\\\">교과 성적<\\/div><div class=\\\"v\\\">'+academicTotal.toFixed(1)+'<span> / '+academicMax+'<\\/span><\\/div><\\/div>';\\n    subHtml += '<div class=\\\"subscore\\\"><div class=\\\"t\\\">출결<\\/div><div class=\\\"v\\\">'+attScore+'<span> / '+attMax+'<\\/span><\\/div><\\/div>';\\n    if(currentTrack.service) subHtml += '<div class=\\\"subscore\\\"><div class=\\\"t\\\">봉사활동<\\/div><div class=\\\"v\\\">'+serviceScore+'<span> / '+serviceMax+'<\\/span><\\/div><\\/div>';\\n    if(currentTrack.bonus) subHtml += '<div class=\\\"subscore\\\"><div class=\\\"t\\\">가산점<\\/div><div class=\\\"v\\\">'+bonusScore+'<span> / '+bonusMax+'<\\/span><\\/div><\\/div>';\\n    subRow.innerHTML = subHtml;\\n\\n    document.getElementById('totalLabel').textContent = currentSchool.name + ' · ' + currentTrack.label + ' 예상 점수';\\n    document.getElementById('stage2Note').textContent = currentSchool.stage2Note || '';\\n\\n    renderDetail(detailRows, academicTotal, attScore, serviceScore, bonusScore, total);\\n    try{ parent.postMessage({type:'calc', school:currentSchool.id, state:JSON.parse(JSON.stringify(state))},'*'); }catch(e){}\\n  }\\n\\n  function renderDetail(rows, academicTotal, attScore, serviceScore, bonusScore, total){\\n    const table = document.getElementById('detailTable');\\n    let html = '<thead><tr><th class=\\\"left\\\">학기<\\/th><th class=\\\"left\\\">과목<\\/th><th>성취도<\\/th><th>환산 점수<\\/th><\\/tr><\\/thead><tbody>';\\n    rows.forEach(r=>{\\n      html += '<tr><td class=\\\"left\\\">'+r.sem+'<\\/td><td class=\\\"left\\\">'+r.subj+'<\\/td><td>'+r.grade+'<\\/td><td>'+r.pts.toFixed(1)+'<\\/td><\\/tr>';\\n    });\\n    html += '<\\/tbody><tfoot>';\\n    html += '<tr><td class=\\\"left\\\" colspan=\\\"3\\\">교과 성적 합계<\\/td><td>'+academicTotal.toFixed(1)+'<\\/td><\\/tr>';\\n    html += '<tr><td class=\\\"left\\\" colspan=\\\"3\\\">출결 점수<\\/td><td>'+attScore+'<\\/td><\\/tr>';\\n    if(currentTrack.service) html += '<tr><td class=\\\"left\\\" colspan=\\\"3\\\">봉사활동 점수<\\/td><td>'+serviceScore+'<\\/td><\\/tr>';\\n    if(currentTrack.bonus) html += '<tr><td class=\\\"left\\\" colspan=\\\"3\\\">가산점<\\/td><td>'+bonusScore+'<\\/td><\\/tr>';\\n    html += '<tr><td class=\\\"left\\\" colspan=\\\"3\\\">총점<\\/td><td>'+total.toFixed(1)+'<\\/td><\\/tr>';\\n    html += '<\\/tfoot>';\\n    table.innerHTML = html;\\n  }\\n\\n  document.getElementById('resetBtn').addEventListener('click', ()=>{\\n    resetState();\\n    renderAll();\\n  });\\n\\n  function renderAll(){\\n    renderTrackArea();\\n    renderTable();\\n    renderAttendance();\\n    renderService();\\n    renderBonus();\\n    document.getElementById('pageFooter').textContent = currentSchool.footer || '';\\n    calc();\\n  }\\n\\n  function init(){\\n    renderPills();\\n    renderAll();\\n  }\\n\\n  window.addEventListener('message',function(e){ if(e.source!==parent||!e.data||e.data.type!=='setState')return; var s=e.data.state||{}; state.grades=s.grades||{}; state.absDays=s.absDays||0; state.lateEtc=s.lateEtc||0; state.serviceHours=s.serviceHours||0; state.bonus=s.bonus||{}; if(s.trackBy){ state.trackBy=s.trackBy; const tt=currentSchool.tracks.find(t=>t.id===state.trackBy[currentSchool.id]); if(tt) currentTrack=tt; } renderAll(); });\\n  init();\\n})();\\n<\\/script>\\n<\\/body>\\n<\\/html>\\n\", \"jecheol\": \"<!DOCTYPE html>\\n<html lang=\\\"ko\\\">\\n<head>\\n<meta charset=\\\"UTF-8\\\">\\n<meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1.0\\\">\\n<title>포항제철고등학교 합격 가능성 예측<\\/title>\\n<style>\\n  :root{\\n    --blue:var(--tp,#1f6fd1); --blue-dark:var(--tp2,#174a96); --blue-light:var(--ts,#edf3fc);\\n    --paper:#f4f6fb; --card:#ffffff; --line:#e3e8f2; --ink:#1d2433; --muted:#66707d;\\n    --hi:#3f9d6e; --hi-bg:#e8f7ee;\\n    --good:#3f9d6e; --good-bg:#eef8ef;\\n    --mid:#a8720a; --mid-bg:#fff6e6;\\n    --bad:#cf5f74; --bad-bg:#fdeceb;\\n  }\\n  *{box-sizing:border-box}\\n  html{height:100%}\\n  body{\\n    margin:0;min-height:100vh;color:var(--ink);\\n    font-family:\\\"Pretendard\\\",\\\"Malgun Gothic\\\",\\\"Apple SD Gothic Neo\\\",sans-serif;line-height:1.5;\\n    background:linear-gradient(180deg,var(--blue-light) 0%,var(--paper) 320px,var(--paper) 100%);\\n    display:flex;justify-content:center;\\n  }\\n  .wrap{width:100%;max-width:1680px;margin:0 auto;padding:clamp(14px,3vw,32px) clamp(14px,4vw,28px) 90px}\\n\\n  .hero{display:flex;gap:clamp(14px,3vw,28px);align-items:center;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:14px;padding:clamp(18px,3vw,28px) clamp(18px,4vw,32px);box-shadow:0 4px 18px rgba(15,42,77,.06)}\\n  .hero img{width:clamp(56px,7vw,80px);height:auto;flex:0 0 auto}\\n  .hero .kicker{font-size:13.8px;letter-spacing:.12em;color:var(--blue);font-weight:700;text-transform:uppercase}\\n  .hero h1{margin:2px 0 4px;font-size:clamp(20px,2.6vw,28px);letter-spacing:-.01em}\\n  .hero p{margin:0;color:var(--muted);font-size:16.1px}\\n\\n  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}\\n  .steps div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.9px;text-align:center;color:var(--blue-dark);font-weight:600}\\n\\n  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,24px);margin-top:16px}\\n  .panel h2{margin:0 0 4px;font-size:20.7px;color:var(--blue-dark)}\\n  .panel .sub{margin:0 0 16px;font-size:14.9px;color:var(--muted)}\\n  .sub-note{background:var(--blue-light);border-radius:8px;padding:10px 12px;font-size:14.4px;color:var(--tp2,#174a96);margin-bottom:14px}\\n\\n  .apply-link{display:inline-block;margin-top:2px;font-size:14.4px;color:var(--blue-dark);text-decoration:underline}\\n\\n  .sem-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}\\n  .sem-card{border:1px solid var(--line);bor order-radius:9px;cursor:pointer}\\n  .print-btn:hover{background:var(--blue-dark)}\\n  .result-toolbar .note{font-size:13.8px;color:var(--muted)}\\n  .print-header{display:none}\\n\\n  .banner{border-radius:14px;padding:20px 24px;display:flex;gap:18px;align-items:center;border:1px solid transparent}\\n  .banner .tag{font-size:13.8px;font-weight:700;letter-spacing:.08em;opacity:.8}\\n  .banner .verdict{font-size:27.6px;font-weight:800;margin:2px 0}\\n  .banner .desc{font-size:16.1px;margin:0}\\n  .banner.hi{background:var(--hi-bg);color:var(--hi);border-color:#b9dba0}\\n  .banner.good{background:var(--good-bg);color:var(--good);border-color:#bfe0c2}\\n  .banner.mid{background:var(--mid-bg);color:var(--mid);border-color:#f1dea0}\\n  .banner.bad{background:var(--bad-bg);color:var(--bad);border-color:#f3c1c1}\\n\\n  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}\\n  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}\\n  .kpi .l{font-size:13.8px;color:var(--muted)}\\n  .kpi .v{font-size:23px;font-weight:800;color:var(--blue-dark)}\\n  .kpi .s{font-size:13.2px;color:var(--muted);margin-top:2px}\\n\\n  table.hist{width:100%;border-collapse:collapse;font-size:14.9px;margin:12px 0}\\n  table.hist th,table.hist td{border:1px solid var(--line);padding:8px 6px;text-align:center}\\n  table.hist th{background:var(--blue-light);color:var(--blue-dark)}\\n\\n  .method{background:var(--blue-light);border-radius:10px;padding:14px 16px;font-size:14.9px;color:var(--tp2,#174a96);margin-top:12px}\\n  .method b{color:var(--blue-dark)}\\n  .method ul{margin:6px 0 0;padding-left:18px}\\n  .method li{margin-bottom:5px}\\n\\n  .warn2{background:var(--mid-bg);color:var(--mid);border-radius:10px;padding:12px 14px;font-size:14.9px;margin:12px 0;font-weight:600}\\n\\n  details.settings{margin-top:18px;border:1px dashed var(--line);border-radius:10px;padding:10px 14px;background:#f8f9fd}\\n  details.set JLhM2uzcHie/jXaEZjAa0ZiqtNf/2Q==\\\" alt=\\\"포항제철고등학교 로고\\\">\\n    <div>\\n      <div class=\\\"kicker\\\">전국단위 자율형사립고<\\/div>\\n      <h1>포항제철고등학교 합격 가능성 예측<\\/h1>\\n      <p>성적을 입력하고 전형을 선택하면, 과거 2개년 자료를 바탕으로 예상 결과를 보여줘요.<\\/p>\\n      <a class=\\\"apply-link\\\" href=\\\"https://www.hischoolgbe.kr\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">실제 원서 접수는 경북고입전형포털에서 진행하세요 →<\\/a>\\n    <\\/div>\\n  <\\/header>\\n\\n  <div class=\\\"steps\\\">\\n    <div>① 성적 입력<\\/div>\\n    <div>② 전형 선택<\\/div>\\n    <div>③ 판정하기<\\/div>\\n    <div>④ 결과 확인<\\/div>\\n  <\\/div>\\n\\n  <section class=\\\"panel\\\">\\n    <h2>1. 내신 성적 입력<\\/h2>\\n    <p class=\\\"sub\\\">2027학년도 산출식 기준 (교과 160점 + 출결 10점 = 170점 만점). 4개 학기 각 과목의 성취도(A~E)를 선택하세요.<\\/p>\\n    <div class=\\\"sub-note\\\">\\n      ※ <b>대체 과목 안내<\\/b> — 학기별로 사회 교과가 개설되지 않은 경우, <b>사회 → 도덕 → 역사<\\/b> 순으로 성적을 대신 반영하세요. (2027학년도 모집요강 기준: 자유학기제 등으로 사회가 없는 학기는 도덕 성적을, 도덕도 없으면 역사 성적을 \\\"사회\\\" 칸에 입력)\\n    <\\/div>\\n\\n    <div class=\\\"sem-grid\\\" id=\\\"semGrid\\\"><\\/div>\\n\\n    <div class=\\\"att-row\\\">\\n      <label for=\\\"absence\\\">무단결석일수<\\/label>\\n      <select id=\\\"absence\\\">\\n        <option value=\\\"0\\\">0일 (10점)<\\/option>\\n        <option value=\\\"1\\\">1~2일 (9점)<\\/option>\\n        <option value=\\\"3\\\">3~4일 (8점)<\\/option>\\n        <option value=\\\"5\\\">5~6일 (7점)<\\/option>\\n        <option value=\\\"7\\\">7~8일 (6점)<\\/option>\\n        <option value=\\\"9\\\">9~10일 (5점)<\\/option>\\n        <option value=\\\"11\\\">11~12일 (4점)<\\/option>\\n        <option value=\\\"13\\\">13~14일 (3점)<\\/option>\\n        <option value=\\\"15\\\">15~16일 (2점)<\\/option>\\n        <option value=\\\"17\\\">17일 이상 (0점)<\\/option>\\n      <\\/select>\\n    <\\/div>\\n\\n    <div class=\\\"live-score\\\">\\n      <span>계산된 총점 (170점 만점)<\\/span>\\n      <b id=\\\"liveScore\\\">160.0<\\/b>\\n    <\\/div>\\n  <\\/section>\\n\\n  <section class=\\\"panel\\\">\\n    <h2>2. 지원 전형 선택<\\/h2>\\n    <p class=\\\"sub\\\">두 전형은 선발 방식이 달라 예측 로직이 다르게 적용돼요.<\\/p>\\n    <div class=\\\"track-grid\\\" id=\\\"trackGrid\\\">\\n      <div class=\\\"track-card\\\" data-track=\\\"jadohak\\\">\\n        <h4>자기주도학습전형 (포항)<\\/h4>\\n        <p>1단계(교과+출결 170점)로 정원의 2배수 선발 → 2단계 면접(30점) → 최종 합계 200점으로 합격자 결정. 올해 정원 60명→50명으로 축소.<\\/p>\\n      <\\/div>\\n      <div class=\\\"track-card\\\" data-track=\\\"posco\\\">\\n        <h4>포스코 임직원 자녀 전형<\\/h4>\\n        <p>면접 없이 교과+출결 170점 총점만으로 일괄 선발. 정원 120명.<\\/p>\\n      <\\/div>\\n    <\\/div>\\n\\n    <div class=\\\"go-row\\\">\\n      <button class=\\\"go\\\" onclick=\\\"run()\\\">판정하기<\\/button>\\n      <span class=\\\"note\\\">입력한 성적은 저장되지 않고 새로고침하면 사라져요.<\\/span>\\n    <\\/div>\\n    <div class=\\\"err\\\" id=\\\"err\\\">전형을 선택했는지 확인해주세요.<\\/div>\\n  <\\/section>\\n\\n  <section id=\\\"result\\\">\\n    <div class=\\\"result-toolbar no-print\\\">\\n      <button class=\\\"print-btn\\\" onclick=\\\"window.print()\\\">🖨 결과 인쇄 / PDF로 저장<\\/button>\\n      <span class=\\\"note\\\">인쇄 대화상자에서 \\\"PDF로 저장\\\"을 선택하면 파일로도 저장할 수 있어요.<\\/span>\\n    <\\/div>\\n    <div class=\\\"print-header\\\">\\n      <span id=\\\"printTitle\\\">포항제철고등학교 합격 가능성 예측 결과<\\/span>\\n      <span id=\\\"printDate\\\"><\\/span>\\n    <\\/div>\\n\\n    <div class=\\\"banner\\\" id=\\\"banner\\\">\\n      <div>\\n        <div class=\\\"tag\\\" id=\\\"bannerTag\\\">종합 판정<\\/div>\\n        <div class=\\\"verdict\\\" id=\\\"verdict\\\">-<\\/div>\\n        <p class=\\\"desc\\\" id=\\\"verdictDesc\\\">-<\\/p>\\n      <\\/div>\\n    <\\/div>\\n\\n    <div class=\\\"kpis\\\">\\n      <div class=\\\"kpi\\\"><div class=\\\"l\\\">내 총점 (170점 만점)<\\/div><div class=\\\"v\\\" id=\\\"kScore\\\">-<\\/div><div class=\\\"s\\\" id=\\\"kBreak\\\"><\\/div><\\/div>\\n      <div class=\\\"kpi\\\"><div class=\\\"l\\\" id=\\\"kDiffLabel1\\\">작년 기준 컷과 차이<\\/div><div class=\\\"v\\\" id=\\\"kDiff1\\\">-<\\/div><div class=\\\"s\\\" id=\\\"kDiff1s\\\"><\\/div><\\/div>\\n      <div class=\\\"kpi\\\"><div class=\\\"l\\\" id=\\\"kDiffLabel2\\\">재작년 기준 컷과 차이<\\/div><div class=\\\"v\\\" id=\\\"kDiff2\\\">-<\\/div><div class=\\\"s\\\" id=\\\"kDiff2s\\\"><\\/div><\\/div>\\n      <div class=\\\"kpi\\\"><div class=\\\"l\\\" id=\\\"kProbLabel\\\">예상 확률<\\/div><div class=\\\"v\\\" id=\\\"kProb\\\">-<\\/div><div class=\\\"s\\\" id=\\\"kProbS\\\"><\\/div><\\/div>\\n    <\\/div>\\n\\n    <table class=\\\"hist\\\" id=\\\"histTable\\\">\\n      <thead><tr><th>기준 연도<\\/th><th>경쟁률<\\/th><th>정원<\\/th><th id=\\\"cutoffColLabel\\\">기준 컷(추정)<\\/th><\\/tr><\\/thead>\\n      <tbody id=\\\"histBody\\\"><\\/tbody>\\n    <\\/table>\\n\\n    <div class=\\\"warn2\\\" id=\\\"quotaWarn\\\" style=\\\"display:none\\\">\\n      ⚠ 자기주도학습전형(포항) 정원이 올해 <b>60명 → 50명<\\/b>으로 줄었어요. 2배수 면접 대상 인원도 그만큼 줄어들어(약 120명 → 100명), 작년·재작년보다 1단계 통과선이 다소 높아질 가능성을 반영해 예측했어요.\\n    <\\/div>\\n\\n    <div class=\\\"method\\\" id=\\\"methodBox\\\"><\\/div>\\n\\n    <details class=\\\"settings no-print\\\">\\n      <summary>⚙ 기준값 설정 (컷 추정치를 직접 조정하고 싶다면 펼치세요)<\\/summary>\\n      <div class=\\\"set-body\\\">\\n        <div class=\\\"set-grid\\\" id=\\\"setGrid\\\"><\\/div>\\n        <button onclick=\\\"applySettings()\\\">적용<\\/button>\\n        <button onclick=\\\"resetSettings()\\\">기본값으로<\\/button>\\n        <span class=\\\"msg\\\" id=\\\"setMsg\\\"><\\/span>\\n      <\\/div>\\n    <\\/details>\\n  <\\/section>\\n\\n<\\/div>\\n\\n\\n\\n<div class=\\\"egg-overlay no-print\\\" id=\\\"eggOverlay\\\" onclick=\\\"closeEgg(event)\\\">\\n  <div class=\\\"egg-box\\\">\\n    <img src=\\\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAACgCAYAAACLz2ctAABrIUlEQVR42u2ddZgcVdbGf7esbdwzcXeBeEhCIFiCE1wXWXRxd9eFXXZZvkUWFnf34BYjHuI+SSbj1t5l9/ujOhMhCVEgC/d55iH0TFdXV7117jnvOec98Mf6Y/2x/lh/rD9W81r80SG+aY/313f1ceWtKFIi/rjC65fyxyX46WprNXTtU+g/b5eC76NBWXbfYbfx6YHBP67wHwDc6hJoQUXjmtQHw/rtqmOmEupBKOI6ErFWf1zhPwC41eXCENVQWwuTK3aJ9XsNVSDO0jShm5IRf1zhPwC4ZbDIWxVhyxG4IBRxUuKNoQfv7DFNfdixiiYORgiEFPv8cZX/AOCW1wfjWygKXXFdNE3RFFXcJj8ZkrfDgB4/tEgRXK2pioIECT3lV/v tringify(DEFAULTS));\\n\\n  // ---------- build semester/subject inputs ----------\\n  function buildSemGrid() {\\n    var grid = document.getElementById(\\\"semGrid\\\");\\n    grid.innerHTML = \\\"\\\";\\n    SEMESTERS.forEach(function (sem) {\\n      var card = document.createElement(\\\"div\\\");\\n      card.className = \\\"sem-card\\\";\\n      var h = document.createElement(\\\"h3\\\");\\n      h.textContent = sem.label + \\\" (\\\" + Math.round(sem.w * 100) + \\\"%)\\\";\\n      card.appendChild(h);\\n      SUBJECTS.forEach(function (subj) {\\n        var row = document.createElement(\\\"div\\\");\\n        row.className = \\\"row\\\";\\n        var lab = document.createElement(\\\"span\\\");\\n        lab.textContent = subj.hint ? (subj.label + \\\" *\\\") : subj.label;\\n        if (subj.hint) lab.title = subj.hint;\\n        var sel = document.createElement(\\\"select\\\");\\n        sel.id = sem.key + \\\"_\\\" + subj.key;\\n        [\\\"A\\\", \\\"B\\\", \\\"C\\\", \\\"D\\\", \\\"E\\\"].forEach(function (g) {\\n          var opt = document.createElement(\\\"option\\\");\\n          opt.value = g;\\n          opt.textContent = g;\\n          sel.appendChild(opt);\\n        });\\n        sel.addEventListener(\\\"change\\\", updateLiveScore);\\n        row.appendChild(lab);\\n        row.appendChild(sel);\\n        card.appendChild(row);\\n        if (subj.hint) {\\n          var hintRow = document.createElement(\\\"div\\\");\\n          hintRow.className = \\\"subj-hint\\\";\\n          hintRow.textContent = \\\"* \\\" + subj.hint;\\n          card.appendChild(hintRow);\\n        }\\n      });\\n      grid.appendChild(card);\\n    });\\n  }\\n\\n  function attendanceScore(days) {\\n    var score = 0;\\n    for (var i = 0; i < ATTENDANCE_TABLE.length; i++) {\\n      if (days >= ATTENDANCE_TABLE[i][0]) score = ATTENDANCE_TABLE[i][1];\\n    }\\n    return score;\\n  }\\n\\n  function computeSubjectScore() {\\n    var total = 0;\\n    SEMESTERS.forEach(function (sem) {\\n      SUBJECTS.forEach(function (subj) {\\n        var el = document.getElementById(sem.key + \\\"_\\\" + subj.key);\\n        var base = GRADE_BASE[el.value];\\n        total += base * subj.w * sem.w;\\n      });\\n    });\\n    return total;\\n  }\\n\\n  function updateLiveScore() {\\n    var subjectScore = computeSubjectScore();\\n    var days = parseInt(document.getElementById(\\\"absence\\\").value, 10) || 0;\\n    var att = attendanceScore(days);\\n    var total = subjectScore + att;\\n    document.getElementById(\\\"liveScore\\\").textContent = total.toFixed(1);\\n    return { subjectScore: subjectScore, att: att, total: total };\\n  }\\n\\n  document.getElementById(\\\"absence\\\").addEventListener(\\\"change\\\", updateLiveScore);\\n\\n  // ---------- track selection ----------\\n  var selectedTrack = null;\\n  document.getElementById(\\\"trackGrid\\\").addEventListener(\\\"click\\\", function (e) {\\n    var card = e.target.closest(\\\".track-card\\\");\\n    if (!card) return;\\n    document.querySelectorAll(\\\".track-card\\\").forEach(function (c) { c.classList.remove(\\\"sel\\\"); });\\n    card.classList.add(\\\"sel\\\");\\n    selectedTrack = card.getAttribute(\\\"data-track\\\");\\n  });\\n\\n  // ---------- normal distribution helper ----------\\n  function erf(x) {\\n    var sign = x < 0 ? -1 : 1;\\n    x = Math.abs(x);\\n    var a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741,\\n        a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;\\n    var t = 1 / (1 + p * x);\\n    var y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);\\n    return sign * y;\\n  }\\n  function normCdf(x, mean, sd) {\\n    return 0.5 * (1 + erf((x - mean) / (sd * Math.sqrt(2))));\\n  }\\n\\n  // ---------- settings panel ----------\\n  function buildSettings() {\\n    var grid = document.getElementById(\\\"setGrid\\\");\\n    grid.innerHTML = \\\"\\\";\\n    function addHeader(text) {\\n      var h = document.createElement(\\\"h4\\\");\\n      h.textContent = text;\\n      grid.appendChild(h);\\n    }\\n    function addField(id, label, value) {\\n      var l = document.createElement(\\\"label\\\");\\n      l.textContent = label;\\n      var i = document.createElement(\\\"input\\\");\\n      i.type = \\\"number\\\";\\n      i.step = \\\"0.1\\\";\\n      i.id = id;\\n      i.value = value;\\n      grid.appendChild(l);\\n      grid.appendChild(i);\\n      grid.appendChild(document.createElement(\\\"span\\\"));\\n    }\\n    addHeader(\\\"자기주도학습전형(포항) — 1단계(면접진출) 통과선 추정\\\");\\n    addField(\\\"set_j_y1_cut\\\", \\\"작년 컷\\\", CFG.jadohak.years[0].cutoff);\\n    addField(\\\"set_j_y1_sd\\\", \\\"작년 변동폭(sd)\\\", CFG.jadohak.years[0].sd);\\n    addField(\\\"set_j_y2_cut\\\", \\\"재작년 컷\\\", CFG.jadohak.years[1].cutoff);\\n    addField(\\\"set_j_y2_sd\\\", \\\"재작년 변동폭(sd)\\\", CFG.jadohak.years[1].sd);\\n    addField(\\\"set_j_shift\\\", \\\"정원감소 반영 상향폭\\\", CFG.jadohak.quotaShift);\\n\\n    addHeader(\\\"포스코 임직원 자녀 전형 — 최종 합격선 추정\\\");\\n    addField(\\\"set_p_y1_cut\\\", \\\"작년 컷\\\", CFG.posco.years[0].cutoff);\\n    addField(\\\"set_p_y1_sd\\\", \\\"작년 변동폭(sd)\\\", CFG.posco.years[0].sd);\\n    addField(\\\"set_p_y2_cut\\\", \\\"재작년 컷\\\", CFG.posco.years[1].cutoff);\\n    addField(\\\"set_p_y2_sd\\\", \\\"재작년 변동폭(sd)\\\", CFG.posco.years[1].sd);\\n  }\\n\\n  function applySettings() {\\n    CFG.jadohak.years[0].cutoff = parseFloat(document.getElementById(\\\"set_j_y1_cut\\\").value);\\n    CFG.jadohak.years[0].sd = parseFloat(document.getElementById(\\\"set_j_y1_sd\\\").value);\\n    CFG.jadohak.years[1].cutoff = parseFloat(document.getElementById(\\\"set_j_y2_cut\\\").value);\\n    CFG.jadohak.years[1].sd = parseFloat(document.getElementById(\\\"set_j_y2_sd\\\").value);\\n    CFG.jadohak.quotaShift = parseFloat(document.getElementById(\\\"set_j_shift\\\").value);\\n    CFG.posco.years[0].cutoff = parseFloat(document.getElementById(\\\"set_p_y1_cut\\\").value);\\n    CFG.posco.years[0].sd = parseFloat(document.getElementById(\\\"set_p_y1_sd\\\").value);\\n    CFG.posco.years[1].cutoff = parseFloat(document.getElementById(\\\"set_p_y2_cut\\\").value);\\n    CFG.posco.years[1].sd = parseFloat(document.getElementById(\\\"set_p_y2_sd\\\").value);\\n    document.getElementById(\\\"setMsg\\\").textContent = \\\"적용되었습니다.\\\";\\n    setTimeout(function () { document.getElementById(\\\"setMsg\\\").textContent = \\\"\\\"; }, 2000);\\n  }\\n\\n  function resetSettings() {\\n    CFG = JSON.parse(JSON.stringify(DEFAULTS));\\n    buildSettings();\\n    document.getElementById(\\\"setMsg\\\").textContent = \\\"기본값으로 되돌렸습니다.\\\";\\n    setTimeout(function () { document.getElementById(\\\"setMsg\\\").textContent = \\\"\\\"; }, 2000);\\n  }\\n\\n  // ---------- main judge logic ----------\\n  function fmtDiff(diff) {\\n    var sign = diff >= 0 ? \\\"+\\\" : \\\"\\\";\\n    return sign + diff.toFixed(1) + \\\"점\\\";\\n  }\\n\\n  function run() {\\n    var err = document.getElementById(\\\"err\\\");\\n    if (!selectedTrack) {\\n      err.style.display = \\\"block\\\";\\n      document.getElementById(\\\"result\\\").style.display = \\\"none\\\";\\n      return;\\n    }\\n    err.style.display = \\\"none\\\";\\n\\n    var sc = updateLiveScore();\\n    var score = sc.total;\\n\\n    var now = new Date();\\n    var pad = function (n) { return (n < 10 ? \\\"0\\\" : \\\"\\\") + n; };\\n    document.getElementById(\\\"printDate\\\").textContent =\\n      \\\"확인일: \\\" + now.getFullYear() + \\\"-\\\" + pad(now.getMonth() + 1) + \\\"-\\\" + pad(now.getDate()) +\\n      \\\" \\\" + pad(now.getHours()) + \\\":\\\" + pad(now.getMinutes());\\n\\n    document.getElementById(\\\"kScore\\\").textContent = score.toFixed(1) + \\\"점\\\";\\n    document.getElementById(\\\"kBreak\\\").textContent =\\n      \\\"교과 \\\" + sc.subjectScore.toFixed(1) + \\\" + 출결 \\\" + sc.att.toFixed(0);\\n\\n    var histBody = document.getElementById(\\\"histBody\\\");\\n    histBody.innerHTML = \\\"\\\";\\n    var quotaWarn = document.getElementById(\\\"quotaWarn\\\");\\n    var methodBox = document.getElementById(\\\"methodBox\\\");\\n    var banner = document.getElementById(\\\"banner\\\");\\n    var verdictEl = document.getElementById(\\\"verdict\\\");\\n    var descEl = document.getElementById(\\\"verdictDesc\\\");\\n    var bannerTag = document.getElementById(\\\"bannerTag\\\");\\n    var probLabel = document.getElementById(\\\"kProbLabel\\\");\\n    var probEl = document.getElementById(\\\"kProb\\\");\\n    var probS = document.getElementById(\\\"kProbS\\\");\\n\\n    if (selectedTrack === \\\"jadohak\\\") {\\n      var jc = CFG.jadohak;\\n      quotaWarn.style.display = \\\"block\\\";\\n      bannerTag.textContent = \\\"1단계(면접 진출) 종합 판정\\\";\\n      probLabel.textContent = \\\"면접 진출 예상 확률\\\";\\n      document.getElementById(\\\"cutoffColLabel\\\").textContent = \\\"1단계 통과선(추정)\\\";\\n\\n      histBody.innerHTML =\\n        \\\"<tr><td>\\\" + jc.years[0].label + \\\"<\\/td><td>\\\" + jc.years[0].ratio + \\\"<\\/td><td>60명<\\/td><td>\\\" + jc.years[0].cutoff + \\\"점 내외<\\/td><\\/tr>\\\" +\\n        \\\"<tr><td>\\\" + jc.years[1].label + \\\"<\\/td><td>\\\" + jc.years[1].ratio + \\\"<\\/td><td>60명<\\/td><td>\\\" + jc.years[1].cutoff + \\\"점 내외<\\/td><\\/tr>\\\" +\\n        \\\"<tr><td>올해(2027)<\\/td><td>-<\\/td><td><b>50명<\\/b><\\/td><td>\\\" + (jc.years[0].cutoff + jc.quotaShift).toFixed(1) + \\\"점 내외(추정)<\\/td><\\/tr>\\\";\\n\\n      var expectedCutoff = jc.years[0].cutoff + jc.quotaShift;\\n      var expectedSd = jc.years[0].sd * 1.3;\\n      var diff1 = score - jc.years[0].cutoff;\\n      var diff2 = score - jc.years[1].cutoff;\\n      document.getElementById(\\\"kDiffLabel1\\\").textContent = jc.years[0].label + \\\" 컷과 차이\\\";\\n      document.getElementById(\\\"kDiffLabel2\\\").textContent = jc.years[1].label + \\\" 컷과 차이\\\";\\n      document.getElementById(\\\"kDiff1\\\").textContent = fmtDiff(diff1);\\n      document.getElementById(\\\"kDiff2\\\").textContent = fmtDiff(diff2);\\n      document.getElementById(\\\"kDiff1s\\\").textContent = diff1 >= 0 ? \\\"통과선 이상\\\" : \\\"통과선 미만\\\";\\n      document.getElementById(\\\"kDiff2s\\\").textContent = diff2 >= 0 ? \\\"통과선 이상\\\" : \\\"통과선 미만\\\";\\n\\n      var prob1 = normCdf(score, jc.years[0].cutoff, jc.years[0].sd);\\n      var prob2 = normCdf(score, jc.years[1].cutoff, jc.years[1].sd);\\n      var probNow = normCdf(score, expectedCutoff, expectedSd);\\n      var blended = probNow * 0.5 + (prob1 * jc.weights[0] + prob2 * jc.weights[1]) * 0.5;\\n      blended = Math.max(0.02, Math.min(0.98, blended));\\n\\n      probEl.textContent = Math.round(blended * 100) + \\\"%\\\";\\n      probS.textContent = \\\"정원 감소 반영 추정치\\\";\\n\\n      var vkey, vlabel, vdesc;\\n      if (blended >= 0.75) { vkey = \\\"hi\\\"; vlabel = \\\"면접 진출 유력\\\"; vdesc = \\\"정원 감소를 반영해도 통과선보다 여유가 있어 보여요.\\\"; }\\n      else if (blended >= 0.45) { vkey = \\\"good\\\"; vlabel = \\\"면접 진출 가능성 높음\\\"; vdesc = \\\"통과선 근처거나 약간 위입니다. 안심하기보다 면접 준비를 병행하세요.\\\"; }\\n      else if (blended >= 0.2) { vkey = \\\"mid\\\"; vlabel = \\\"경계선\\\"; vdesc = \\\"정원 축소로 통과선이 오를 가능성이 있어, 결과를 낙관하기 어려운 위치예요.\\\"; }\\n      else { vkey = \\\"bad\\\"; vlabel = \\\"면접 진출 어려움\\\"; vdesc = \\\"과거 통과선보다 상당히 낮아, 이 전형만으로는 어려울 수 있어요.\\\"; }\\n      banner.className = \\\"banner \\\" + vkey;\\n      verdictEl.textContent = vlabel;\\n      descEl.textContent = vdesc;\\n\\n      methodBox.innerHTML =\\n        \\\"<b>이렇게 계산했어요<\\/b>\\\" +\\n        \\\"<ul>\\\" +\\n        \\\"<li>자기주도학습전형(포항)은 <b>1단계에서 정원의 2배수<\\/b>가 면접 대상자로 선발돼요. 여기서는 <b>1단계 통과(면접 진출) 가능성<\\/b>을 예측합니다.<\\/li>\\\" +\\n        \\\"<li>작년·재작년 1단계 통과선(추정치)과 학생 점수를 정규분포 모델로 비교해 확률을 추정해요.<\\/li>\\\" +\\n        \\\"<li>올해는 정원이 <b>60명 → 50명<\\/b>으로 줄어 2배수 면접 인원도 함께 줄어들므로, 작년 통과선에 <b>+\\\" + jc.quotaShift + \\\"점<\\/b>을 더하고 불확실성(변동폭)도 30% 넓혀 '올해 예상 통과선'을 별도로 반영했어요.<\\/li>\\\" +\\n        \\\"<li>최종 표시 확률은 '올해 예상 통과선' 기준 확률과 '작년·재작년 실제 통과선' 기준 확률을 절반씩 섞은 값이에요.<\\/li>\\\" +\\n        \\\"<li><b>1단계를 통과해도 최종 합격이 확정되는 것은 아니며<\\/b>, 2단계 면접(30점)까지 합산한 총점(200점)으로 최종 합격자가 결정돼요.<\\/li>\\\" +\\n        \\\"<\\/ul>\\\";\\n\\n    } else {\\n      var pc = CFG.posco;\\n      quotaWarn.style.display = \\\"none\\\";\\n      bannerTag.textContent = \\\"종합 판정 (임직원 자녀 전형)\\\";\\n      probLabel.textContent = \\\"최종 합격 예상 확률\\\";\\n      document.getElementById(\\\"cutoffColLabel\\\").textContent = \\\"최종 합격선(추정)\\\";\\n\\n      histBody.innerHTML =\\n        \\\"<tr><td>\\\" + pc.years[0].label + \\\"<\\/td><td>\\\" + pc.years[0].ratio + \\\"<\\/td><td>120명<\\/td><td>\\\" + pc.years[0].cutoff + \\\"점 내외<\\/td><\\/tr>\\\" +\\n        \\\"<tr><td>\\\" + pc.years[1].label + \\\"<\\/td><td>\\\" + pc.years[1].ratio + \\\"<\\/td><td>120명<\\/td><td>\\\" + pc.years[1].cutoff + \\\"점 내외<\\/td><\\/tr>\\\" +\\n        \\\"<tr><td>올해(2027)<\\/td><td>-<\\/td><td>120명<\\/td><td>정원 변동 없음 — 과거와 유사할 것으로 추정<\\/td><\\/tr>\\\";\\n\\n      var diffA = score - pc.years[0].cutoff;\\n      var diffB = score - pc.years[1].cutoff;\\n      document.getElementById(\\\"kDiffLabel1\\\").textContent = pc.years[0].label + \\\" 컷과 차이\\\";\\n      document.getElementById(\\\"kDiffLabel2\\\").textContent = pc.years[1].label + \\\" 컷과 차이\\\";\\n      document.getElementById(\\\"kDiff1\\\").textContent = fmtDiff(diffA);\\n      document.getElementById(\\\"kDiff2\\\").textContent = fmtDiff(diffB);\\n      document.getElementById(\\\"kDiff1s\\\").textContent = diffA >= 0 ? \\\"합격선 이상\\\" : \\\"합격선 미만\\\";\\n      document.getElementById(\\\"kDiff2s\\\").textContent = diffB >= 0 ? \\\"합격선 이상\\\" : \\\"합격선 미만\\\";\\n\\n      var probA = normCdf(score, pc.years[0].cutoff, pc.years[0].sd);\\n      var probB = normCdf(score, pc.years[1].cutoff, pc.years[1].sd);\\n      var blendedP = probA * pc.weights[0] + probB * pc.weights[1];\\n      blendedP = Math.max(0.02, Math.min(0.98, blendedP));\\n\\n      probEl.textContent = Math.round(blendedP * 100) + \\\"%\\\";\\n      probS.textContent = \\\"정원 변동 없음 (120명)\\\";\\n\\n      var vkey2, vlabel2, vdesc2;\\n      if (blendedP >= 0.75) { vkey2 = \\\"hi\\\"; vlabel2 = \\\"합격 유력\\\"; vdesc2 = \\\"과거 2개년 합격선보다 여유 있게 높은 점수예요.\\\"; }\\n      else if (blendedP >= 0.45) { vkey2 = \\\"good\\\"; vlabel2 = \\\"합격 가능성 높음\\\"; vdesc2 = \\\"합격선 근처거나 약간 위입니다.\\\"; }\\n      else if (blendedP >= 0.2) { vkey2 = \\\"mid\\\"; vlabel2 = \\\"경계선\\\"; vdesc2 = \\\"그 해 지원자 수준에 따라 결과가 갈릴 수 있는 위치예요.\\\"; }\\n      else { vkey2 = \\\"bad\\\"; vlabel2 = \\\"합격 어려움\\\"; vdesc2 = \\\"과거 합격선보다 상당히 낮은 편이에요.\\\"; }\\n      banner.className = \\\"banner \\\" + vkey2;\\n      verdictEl.textContent = vlabel2;\\n      descEl.textContent = vdesc2;\\n\\n      methodBox.innerHTML =\\n        \\\"<b>이렇게 계산했어요<\\/b>\\\" +\\n        \\\"<ul>\\\" +\\n        \\\"<li>포스코 임직원 자녀 전형은 <b>면접 없이<\\/b> 교과+출결 170점 총점만으로 일괄 선발돼요. 따라서 여기서는 <b>최종 합격 가능성<\\/b>을 바로 예측합니다.<\\/li>\\\" +\\n        \\\"<li>작년·재작년 합격선(추정치)과 학생 점수를 정규분포 모델로 비교해 확률을 추정하고, 두 해를 6:4 비율로 섞어 최종 확률을 만들어요.<\\/li>\\\" +\\n        \\\"<li>이 전형은 정원이 <b>120명으로 변동이 없어<\\/b>, 자기주도학습전형처럼 별도의 정원 조정 반영은 하지 않았어요.<\\/li>\\\" +\\n        \\\"<\\/ul>\\\";\\n    }\\n\\n    document.getElementById(\\\"result\\\").style.display = \\\"block\\\";\\n    document.getElementById(\\\"result\\\").scrollIntoView({ behavior: \\\"smooth\\\", block: \\\"start\\\" });\\n\\n    var scoreLabel = document.getElementById(\\\"kScore\\\");\\n    if (score >= 169.95) {\\n      scoreLabel.innerHTML = score.toFixed(1) + \\\"점 <span class=\\\\\\\"perfect-badge\\\\\\\" onclick=\\\\\\\"celebratePerfect()\\\\\\\">만점 🎉<\\/span>\\\";\\n    }\\n  }\\n\\n  function openEgg() {\\n    document.getElementById(\\\"eggTitle\\\").textContent = \\\"화이팅!\\\";\\n    document.getElementById(\\\"eggMsg\\\").textContent = \\\"이 프로그램을 쓰는 모든 학생의 합격을 응원합니다. 결과는 참고용일 뿐, 진짜 실력은 마지막까지 최선을 다하는 마음이에요 🎉\\\";\\n    document.getElementById(\\\"eggOverlay\\\").classList.add(\\\"show\\\");\\n  }\\n  function closeEgg(e) {\\n    if (e && e.target && e.target.closest(\\\".egg-box\\\") && e.target.tagName !== \\\"BUTTON\\\") return;\\n    document.getElementById(\\\"eggOverlay\\\").classList.remove(\\\"show\\\");\\n  }\\n  function celebratePerfect() {\\n    document.getElementById(\\\"eggTitle\\\").textContent = \\\"만점입니다! 🎉\\\";\\n    document.getElementById(\\\"eggMsg\\\").textContent = \\\"170점 만점! 정말 대단해요. 그래도 자기주도학습전형은 면접이 남아있으니 끝까지 화이팅입니다!\\\";\\n    document.getElementById(\\\"eggOverlay\\\").classList.add(\\\"show\\\");\\n  }\\n\\n  buildSemGrid();\\n  buildSettings();\\n  updateLiveScore();\\n<\\/script>\\n\\n<\\/body>\\n<\\/html>\\n\", \"tech\": \"<!DOCTYPE html>\\n<html lang=\\\"ko\\\">\\n<head>\\n<meta charset=\\\"UTF-8\\\">\\n<meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1.0\\\">\\n<title>포항제철공업고등학교 합격 가능성 예측<\\/title>\\n<style>\\n  :root{\\n    --brown:var(--tp,#1f6fd1); --brown-dark:var(--tp2,#174a96); --brown-light:var(--ts,#edf3fc);\\n    --gold:#eab85a; --gold-light:#fdf5e3;\\n    --ink:#1d2433; --muted:#6b7280; --line:#e3e8f2; --paper:#f4f6fb; --card:#ffffff;\\n    --good:#4aa56f; --good-bg:#e8f5e9; --mid:#b07a0b; --mid-bg:#fff7e0; --bad:#cf5f74; --bad-bg:#fdecec;\\n    --hi:#2f7d58; --hi-bg:#dcedc8;\\n  }\\n  *{box-sizing:border-box}\\n  html{height:100%}\\n  body{\\n    margin:0;min-height:100vh;color:var(--ink);\\n    font-family:\\\"Pretendard\\\",\\\"Malgun Gothic\\\",\\\"Apple SD Gothic Neo\\\",sans-serif;line-height:1.5;\\n    background:linear-gradient(180deg,var(--brown-light) 0%,var(--paper) 320px,var(--paper) 100%);\\n    display:flex;justify-content:center;\\n  }\\n  .wrap{width:100%;max-width:1680px;margin:0 auto;padding:clamp(14px,3vw,32px) clamp(14px,4vw,28px) 90px}\\n\\n  /* header */\\n  .hero{display:flex;gap:clamp(14px,3vw,28px);align-items:center;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--brown);border-radius:14px;padding:clamp(18px,3vw,28px) clamp(18px,4vw,32px);box-shadow:0 4px 18px rgba(15,42,77,.06)}\\n  .hero img{width:clamp(64px,8vw,96px);height:auto;flex:0 0 auto}\\n  .hero .kicker{font-size:13.8px;letter-spacing:.12em;color:var(--brown);font-weight:700;text-transform:uppercase}\\n  .hero h1{margin:2px 0 4px;font-size:clamp(20px,2.6vw,28px);letter-spacing:-.01em}\\n  .hero p{margin:0;color:var(--muted);font-size:16.1px}\\n  .facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}\\n  .fact{font-size:13.8px;background:var(--brown-light);color:var(--brown-dark);border-radius:6px;padding:4px 10px;font-weight:600}\\n\\n  /* steps */\\n  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}\\n  .step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14.9px;color:var(--muted)}\\n  .step b{display:block;color:var(--ink);font-size:16.1px;margin-bottom:2px}\\n  .step .n{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--brown);color:#fff;font-size:13.8px;text-align:center;line-height:20px;margin-right:6px;font-weight:700}\\n\\n  /* input panel */\\n  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin-bottom:16px}\\n  .panel h2{margin:0 0 4px;font-size:19.5px}\\n  .panel .sub{margin:0 0 14px;color:var(--muted);font-size:14.9px}\\n  .site-btn{display:inline-flex;align-items:center;gap:8px;background:var(--brown);color:#fff;text-decoration:none;font-weight:700;padding:11px 18px;border-radius:9px;font-size:16.1px}\\n  .site-btn:hover{background:var(--brown-dark)}\\n  .site-btn small{font-weight:400;opacity:.85}\\n  .form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}\\n  .field label{display:block;font-size:14.9px;font-weight:700;margin-bottom:6px}\\n  .field label span{color:var(--muted);font-weight:400}\\n  .field input,.field select{width:100%;font-size:18.4px;padding:11px 12px;border:1.5px solid #d5dbe9;border-radius:9px;background:#fff;color:var(--ink)}\\n  .field input:focus,.field select:focus{outline:none;border-color:var(--brown);box-shadow:0 0 0 3px rgba(143,58,47,.12)}\\n  .field .help{font-size:13.8px;color:var(--muted);margin-top:5px}\\n  .main-input input{font-size:25.3px;font-weight:700;padding:12px 14px}\\n  .go{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}\\n  .go button{background:var(--brown);color:#fff;border:none;font-weight:800;font-size:18.4px;padding:13px 26px;border-radius:9px;cursor:pointer}\\n  .go button:hover{filter:brightness(.95)}\\n  .go .note{font-size:13.8px;color:var(--muted)}\\n  .err{color:var(--bad);font-size:14.9px;font-weight:600;display:none;grid-column:1/-1}\\n\\n  /* result */\\n  #result{display:none}\\n  .banner{border-radius:14px;padding:20px 24px;display:flex;gap:18px;align-items:center;border:1px solid transparent}\\n  .banner .tag{font-size:13.8px;font-weight:700;letter-spacing:.08em;opacity:.8}\\n  .banner .verdict{font-size:29.9px;font-weight:800;margin:2px 0}\\n  .banner .desc{font-size:16.1px;margin:0}\\n  .banner.hi{background:var(--hi-bg);color:var(--hi);border-color:#b9dba0}\\n  .banner.good{background:var(--good-bg);color:var(--good);border-color:#bfe0c2}\\n  .banner.mid{background:var(--mid-bg);color:var(--mid);border-color:#f1dea0}\\n  .banner.bad{background:var(--bad-bg);color:var(--bad);border-color:#f3c1c1}\\n  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}\\n  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}\\n  .kpi .l{font-size:13.8px;color:var(--muted)}\\n  .kpi .v{font-size:29.9px;font-weight:800;margin-top:2px}\\n  .kpi .s{font-size:13.8px;color:var(--muted)}\\n  .pos{color:var(--good)} .neg{color:var(--bad)}\\n\\n  .yr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:10px}\\n  .yr-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}\\n  .yr-head h3{margin:0;font-size:18.4px}\\n  .yr-head h3 span{color:var(--muted);font-weight:400;font-size:14.9px;margin-left:6px}\\n  .badge{font-size:13.8px;font-weight:700;padding:3px 10px;border-radius:5px}\\n  .badge.hi{background:var(--hi-bg);color:var(--hi)} .badge.good{background:var(--good-bg);color:var(--good)}\\n  .badge.mid{background:var(--mid-bg);color:var(--mid)} .badge.bad{background:var(--bad-bg);color:var(--bad)}\\n  .bar{position:relative;height:34px;margin:22px 0 26px;border-radius:6px;overflow:visible;background:#eee}\\n  .bar .zone-bad{position:absolute;left:0;top:0;bottom:0;background:#f5c9c9;border-radius:6px 0 0 6px}\\n  .bar .zone-ok{position:absolute;top:0;bottom:0;background:#cfe8d1}\\n  .bar .zone-hi{position:absolute;top:0;bottom:0;right:0;background:#b4d9a3;border-radius:0 6px 6px 0}\\n  .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:#555}\\n  .mark .lb{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:12.6px;color:var(--muted);white-space:nowrap;margin-top:3px}\\n  .me{position:absolute;top:-10px;bottom:-10px;width:4px;background:var(--brown);border-radius:2px}\\n  .me .lb{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:13.8px;font-weight:800;color:var(--brown);white-space:nowrap;margin-bottom:3px}\\n  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}\\n  .cell{font-size:14.9px;color:var(--muted)}\\n  .cell b{display:block;color:var(--ink);font-size:17.2px}\\n  .warn{background:var(--gold-light);border:1px solid #efd9a3;color:#6b4d05;border-radius:9px;padding:10px 14px;font-size:14.9px;margin-bottom:10px}\\n  .method{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 20px;font-size:14.9px;color:var(--muted)}\\n  .method ul{margin:6px 0 0;padding-left:18px}\\n\\n  /* settings */\\n  details.settings{margin-top:22px;border:1px dashed #d5dbe9;border-radius:12px;background:#f8f9fd}\\n  details.settings summary{cursor:pointer;padding:12px 16px;font-size:14.9px;color:var(--muted);font-weight:600}\\n  .set-body{padding:0 16px 16px}\\n  .set-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}\\n  .set-grid label{font-size:13.8px;color:var(--muted);display:block}\\n  .set-grid input{width:100%;padding:7px 8px;font-size:16.1px;border:1px solid #d5dbe9;border-radius:6px}\\n  .set-grid h4{grid-column:1/-1;margin:8px 0 0;font-size:14.9px;color:var(--brown-dark)}\\n  .set-body button{background:var(--brown);color:#fff;border:none;padding:8px 16px;border-radius:7px;font-weight:700;cursor:pointer;margin-right:6px}\\n  .set-body .msg{font-size:13.8px;color:var(--good);margin-left:6px}\\n\\n  /* credit */\\n  .credit{position:fixed;right:14px;bottom:10px;display:flex;align-items:flex-end;gap:6px;opacity:.75;font-size:12.6px;color:var(--muted);pointer-events:none;user-select:none}\\n  .credit img{width:44px;height:auto;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}\\n  .credit span{background:rgba(255,255,255,.85);padding:2px 7px;border-radius:5px;border:1px solid var(--line);margin-bottom:6px}\\n  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(3deg)}}\\n\\n  @media (max-width:640px){\\n    .hero{flex-direction:column;text-align:center}\\n    .steps,.kpis,.form,.grid4,.set-grid{grid-template-columns:1fr 1fr}\\n    .steps{grid-template-columns:1fr}\\n    .banner{flex-direction:column;align-items:flex-start}\\n  }\\n  @media print{.credit{position:static;opacity:.6}.site-btn,.go,details.settings{display:none}}\\n\\n  /* print / export */\\n  .result-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}\\n  .print-btn{background:var(--brown);color:#fff;border:none;font-weight:800;font-size:16.1px;padding:11px 20px;border-radius:9px;cursor:pointer}\\n  .print-btn:hover{background:var(--brown-dark)}\\n  .result-toolbar .note{font-size:13.8px;color:var(--muted)}\\n  .print-header{display:none}\\n  @media print{\\n    body{background:#fff}\\n    .credi
