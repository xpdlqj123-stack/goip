UxF45YlpOjd51nZB6fl7FMF2W6OtdHY08///x//sdzP0lyZnMmKwqheUbm8TdJdAA0Vdm+davfV/j662/sP3Z0IRHnSO5as8kzMo/PCwxAksT77+/yFQWm4pFDR44gRf5ZbsfmkcdfgY2YHpPlAHU1K771xBNTtyYoRYS8187jb5zngEyFvvu7qcMHBwZty5YkMc/IPD5nFmLuDATnnBLS032/x+0C4PzOOjlynm/A5PH5Zjn8tsZ27r/TyE9I5PG5m8z00C5L3yzLZzZ5fGFIuSzyNjKPLxhZ83FkHl8o/D9iL3gO37Cc6AAAAABJRU5ErkJggg==\\\" alt=\\\"포항제철공업고등학교 교표\\\">\\n    <div>\\n      <div class=\\\"kicker\\\">마이스터고 · 일반전형 · 1차 서류전형<\\/div>\\n      <h1>포항제철공업고등학교 합격 가능성 예측<\\/h1>\\n      <p>내 교과 점수를 입력하면 최근 2년(2026·2025학년도) 1차 전형 결과와 비교해 합격 가능성을 알려줍니다.<\\/p>\\n      <div class=\\\"facts\\\">\\n        <span class=\\\"fact\\\">교과 점수 만점 130점<\\/span>\\n        <span class=\\\"fact\\\">1차 전형: 정원의 1.3배수 선발<\\/span>\\n        <span class=\\\"fact\\\">교과 반영: 2학년 1·2학기 + 3학년 1학기<\\/span>\\n        <span class=\\\"fact\\\">출결·봉사는 만점 가정<\\/span>\\n      <\\/div>\\n    <\\/div>\\n  <\\/header>\\n\\n  <div class=\\\"steps\\\">\\n    <div class=\\\"step\\\"><b><span class=\\\"n\\\">1<\\/span>성적 확인<\\/b>학교 입학 홈페이지에서 내 교과 점수를 계산해요.<\\/div>\\n    <div class=\\\"step\\\"><b><span class=\\\"n\\\">2<\\/span>점수 입력<\\/b>계산된 교과 점수(130점 만점)를 아래에 입력해요.<\\/div>\\n    <div class=\\\"step\\\"><b><span class=\\\"n\\\">3<\\/span>결과 확인<\\/b>작년·재작년 합격자와 비교한 내 위치를 확인해요.<\\/div>\\n  <\\/div>\\n\\n  <section class=\\\"panel\\\">\\n    <h2>내 점수 입력<\\/h2>\\n    <p class=\\\"sub\\\">교과 점수는 포항제철공고 입학 홈페이지의 성적 산출 페이지에서 확인할 수 있어요.<\\/p>\\n    <a class=\\\"site-btn\\\" href=\\\"http://apply.pocheoltech.hs.kr/subpage/sub_02\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">포항제철공고 성적 산출 페이지 열기 <small>↗ 새 창<\\/small><\\/a>\\n\\n    <div class=\\\"form\\\">\\n      <div class=\\\"field main-input\\\">\\n        <label for=\\\"score\\\">내 교과 점수 <span id=\\\"maxLabel\\\">(130점 만점)<\\/span><\\/label>\\n        <input type=\\\"number\\\" id=\\\"score\\\" min=\\\"0\\\" max=\\\"130\\\" step=\\\"0.01\\\" placeholder=\\\"예: 96.5\\\">\\n        <div class=\\\"help\\\">소수점까지 그대로 입력하세요.<\\/div>\\n      <\\/div>\\n      <div class=\\\"field\\\">\\n        <label for=\\\"hanguksa\\\">한국사능력검정시험 <span>(선택)<\\/span><\\/label>\\n        <select id=\\\"hanguksa\\\">\\n          <option value=\\\"0\\\">해당 없음 (0점)<\\/option>\\n          <option value=\\\"3\\\">3급 (3점)<\\/option>\\n          <option value=\\\"5\\\">1급 또는 2급 (5점)<\\/option>\\n        <\\/select>\\n      <\\/div>\\n      <div class=\\\"field\\\">\\n        <label for=\\\"computer\\\">컴퓨터활용능력 <span>(선택)<\\/span><\\/label>\\n        <select id=\\\"computer\\\">\\n          <option value=\\\"0\\\">해당 없음 (0점)<\\/option>\\n          <option value=\\\"3\\\">2급 (3점)<\\/option>\\n          <option value=\\\"5\\\">1급 (5점)<\\/option>\\n        <\\/select>\\n        <div class=\\\"help\\\">가산점 합계 최대 10점. 합격선은 교과 점수 기준이라 가산점은 참고로만 표시돼요.<\\/div>\\n      <\\/div>\\n      <div class=\\\"err\\\" id=\\\"err\\\">0 ~ 130 사이의 점수를 입력해 주세요.<\\/div>\\n      <div class=\\\"go\\\">\\n        <button id=\\\"goBtn\\\" onclick=\\\"run()\\\">결과 보기<\\/button>\\n        <span class=\\\"note\\\">입력한 점수는 저장되지 않고 새로 고침하면 사라져요.<\\/span>\\n      <\\/div>\\n    <\\/div>\\n  <\\/section>\\n\\n  <section id=\\\"result\\\">\\n    <div id=\\\"exampleWarn\\\" class=\\\"warn\\\">⚠ 합격자 평균은 아직 <b>예시값<\\/b>이에요. 학교가 공개한 실제 평균을 아래 \\\"기준값 설정\\\"에 입력하면 더 정확해져요.<\\/div>\\n    <div class=\\\"result-toolbar no-print\\\">\\n      <button class=\\\"print-btn\\\" onclick=\\\"window.print()\\\">🖨 결과 인쇄 / PDF로 저장<\\/button>\\n      <span class=\\\"note\\\">인쇄 대화상자에서 \\\"PDF로 저장\\\"을 선택하면 파일로도 저장할 수 있어요.<\\/span>\\n    <\\/div>\\n    <div class=\\\"print-header\\\">\\n      <span id=\\\"printSchoolName\\\">포항제철공업고등학교 합격 가능성 예측 결과<\\/span>\\n      <span id=\\\"printDate\\\"><\\/span>\\n    <\\/div>\\n    <div class=\\\"banner\\\" id=\\\"banner\\\">\\n      <div>\\n        <div class=\\\"tag\\\">종합 판정<\\/div>\\n        <div class=\\\"verdict\\\" id=\\\"verdict\\\">-<\\/div>\\n        <p class=\\\"desc\\\" id=\\\"verdictDesc\\\">-<\\/p>\\n      <\\/div>\\n    <\\/div>\\n    <div class=\\\"kpis\\\">\\n      <div class=\\\"kpi\\\"><div class=\\\"l\\\">내 교과 점수<\\/div><div class=\\\"v\\\" id=\\\"kScore\\\">-<\\/div><div class=\\\"s\\\" id=\\\"kBonus\\\"><\\/div><\\/div>\\n      <div class=\\\"kpi\\\"><div class=\\\"l\\\">작년(2026) 1차 합격선과 차이<\\/div><div class=\\\"v\\\" id=\\\"kDiff\\\">-<\\/div><div class=\\\"s\\\" id=\\\"kDiffS\\\"><\\/div><\\/div>\\n      <div class=\\\"kpi\\\"><div class=\\\"l\\\">작년(2026) 합격자 중 예상 위치<\\/div><div class=\\\"v\\\" id=\\\"kRank\\\">-<\\/div><div class=\\\"s\\\">합격자 100명 기준<\\/div><\\/div>\\n    <\\/div>\\n    <div id=\\\"years\\\"><\\/div>\\n    <div class=\\\"method\\\">\\n      <b>이렇게 계산했어요<\\/b>\\n      <ul>\\n        <li><b>1차 합격선<\\/b>은 그 해 1차 전형(정원의 1.3배수)을 통과한 학생 중 가장 낮은 교과 점수예요. 합격선을 넘으면 1차 통과 가능성이 높아요.<\\/li>\\n        <li><b>합격자 평균<\\/b>과 비교해 합격자 집단 안에서 내 위치(100명 중 몇 등)를 추정해요. 합격자 점수가 정규분포를 따른다고 가정하고, 표준편차를 모르면 (평균 − 합격선) ÷ 1.5 로 추정해요.<\\/li>\\n        <li>판정: <b>매우 높음<\\/b> = 합격자 평균 이상 · <b>높음<\\/b> = 합격선 이상, 평균 미만 · <b>경계<\\/b> = 합격선 3점 이내 미달 · <b>낮음<\\/b> = 그 이하. 종합 판정은 작년 60%, 재작년 40% 가중치예요.<\\/li>\\n        <li>1차 통과 후 2차 전형(마이스터 적성·소양검사, 심층면접, 신체검사)이 있으므로 교과 점수만으로 최종 합격을 보장하지는 않아요.<\\/li>\\n        <li>⚠ <b>2027학년도부터 교과성적 반영 범위가 바뀌었어요.<\\/b> 2025·2026학년도 합격선은 1·2·3학년 성적을 모두 반영해 산출된 값이지만, 2027학년도부터는 1학년 성적이 완전히 제외되고 2·3학년 성적만 반영돼요(2027학년도 요강 및 동점자 처리 기준으로 확인). 두 방식의 130점 환산값은 완전히 동일하지 않을 수 있어, 이 비교는 참고용 근사치로만 활용해 주세요.<\\/li>\\n      <\\/ul>\\n    <\\/div>\\n  <\\/section>\\n\\n  <details class=\\\"settings\\\">\\n    <summary>기준값 설정 (선생님용) — 합격선 · 합격자 평균 · 판정 기준 수정<\\/summary>\\n    <div class=\\\"set-body\\\">\\n      <div class=\\\"set-grid\\\" id=\\\"setGrid\\\"><\\/div>\\n      <button onclick=\\\"applySettings()\\\">적용<\\/button>\\n      <button onclick=\\\"resetSettings()\\\" style=\\\"background:#8a8a8a\\\">기본값으로<\\/button>\\n      <span class=\\\"msg\\\" id=\\\"setMsg\\\"><\\/span>\\n      <p style=\\\"font-size:13.8px;color:var(--muted);margin:10px 0 0\\\">※ 여기서 바꾼 값은 새로 고침하면 원래대로 돌아가요. 영구 반영은 파일 안의 <code>DEFAULTS<\\/code> 값을 수정하세요.<\\/p>\\n    <\\/div>\\n  <\\/details>\\n\\n<\\/div>\\n\\n\\n\\n<script>\\n  var DEFAULTS = {\\n    subjectMax: 130,\\n    years: [\\n      { year: 2026, label: \\\"작년\\\",   cutoff: 92, avg: 108,   sd: null, ratio: 1.3, example: false },\\n      { year: 2025, label: \\\"재작년\\\", cutoff: 85, avg: 102.5, sd: null, ratio: 1.3, example: false }\\n    ],\\n    borderline: 3,\\n    weights: [0.6, 0.4]\\n  };\\n  var CFG = JSON.parse(JSON.stringify(DEFAULTS));\\n\\n  function normCdf(z) {\\n    var t = 1 / (1 + 0.2316419 * Math.abs(z));\\n    var d = 0.3989423 * Math.exp(-z * z / 2);\\n    var p = d * t * (((( 1.330274429 * t - 1.821255978) * t + 1.781477937) * t - 0.356563782) * t + 0.319381530);\\n    return z > 0 ? 1 - p : p;\\n  }\\n\\n  function evalYear(score, y) {\\n    var sd = y.sd && y.sd > 0 ? y.sd : Math.max((y.avg - y.cutoff) / 1.5, 1);\\n    var z = (score - y.avg) / sd;\\n    var pct = normCdf(z);\\n    var rank = Math.round((1 - pct) * 100);\\n    if (rank < 1) rank = 1;\\n    if (rank > 100) rank = 100;\\n    var level, key;\\n    if (score >= y.avg) { level = \\\"매우 높음\\\"; key = \\\"hi\\\"; }\\n    else if (score >= y.cutoff) { level = \\\"높음\\\"; key = \\\"good\\\"; }\\n    else if (score >= y.cutoff - CFG.borderline) { level = \\\"경계\\\"; key = \\\"mid\\\"; }\\n    else { level = \\\"낮음\\\"; key = \\\"bad\\\"; }\\n    var scoreMap = { hi: 3, good: 2, mid: 1, bad: 0 };\\n    return { diff: score - y.cutoff, rank: rank, level: level, key: key, pass: score >= y.cutoff, num: scoreMap[key], sd: sd };\\n  }\\n\\n  function fmt(n) {\\n    return (Math.round(n * 100) / 100).toString();\\n  }\\n  function fmtDiff(n) {\\n    var s = fmt(Math.abs(n));\\n    return (n >= 0 ? \\\"+\\\" : \\\"−\\\") + s + \\\"점\\\";\\n  }\\n  function pctPos(v, lo, hi) {\\n    var p = (v - lo) / (hi - lo) * 100;\\n    if (p < 0) p = 0;\\n    if (p > 100) p = 100;\\n    return p;\\n  }\\n\\n  function run() {\\n    var el = document.getElementById(\\\"score\\\");\\n    var score = parseFloat(el.value);\\n    var err = document.getElementById(\\\"err\\\");\\n    if (isNaN(score) || score < 0 || score > CFG.subjectMax) {\\n      err.style.display = \\\"block\\\";\\n      document.getElementById(\\\"result\\\").style.display = \\\"none\\\";\\n      return;\\n    }\\n    err.style.display = \\\"none\\\";\\n    var hanguksa = parseFloat(document.getElementById(\\\"hanguksa\\\").value) || 0;\\n    var computer = parseFloat(document.getElementById(\\\"computer\\\").value) || 0;\\n    var bonus = hanguksa + computer;\\n\\n    var now = new Date();\\n    var pad = function (n) { return (n < 10 ? \\\"0\\\" : \\\"\\\") + n; };\\n    document.getElementById(\\\"printDate\\\").textContent =\\n      \\\"확인일: \\\" + now.getFullYear() + \\\"-\\\" + pad(now.getMonth() + 1) + \\\"-\\\" + pad(now.getDate()) +\\n      \\\" \\\" + pad(now.getHours()) + \\\":\\\" + pad(now.getMinutes());\\n\\n    var results = CFG.years.map(function (y) { return evalYear(score, y); });\\n    var overall = 0;\\n    for (var i = 0; i < results.length; i++) {\\n      overall += results[i].num * (CFG.weights[i] || 0);\\n    }\\n\\n    var banner = document.getElementById(\\\"banner\\\");\\n    var verdict, desc, key;\\n    if (overall >= 2.5) {\\n      key = \\\"hi\\\"; verdict = \\\"합격 가능성 매우 높음\\\";\\n      desc = \\\"최근 2년 합격자 평균 이상이에요. 1차 통과 가능성이 높고, 2차 전형(적성검사·면접)만 잘 준비하면 돼요.\\\";\\n    } else if (overall >= 1.6) {\\n      key = \\\"good\\\"; verdict = \\\"합격 가능성 높음\\\";\\n      desc = \\\"최근 2년 1차 합격선을 넘었어요. 다만 합격자 중 하위권일 수 있으니 2차 전형 준비가 중요해요.\\\";\\n    } else if (overall >= 0.7) {\\n      key = \\\"mid\\\"; verdict = \\\"경계 — 소신 지원\\\";\\n      desc = \\\"합격선 근처예요. 해마다 합격선이 오르내리므로 통과할 수도, 아닐 수도 있어요. 선생님과 상담해 보세요.\\\";\\n    } else {\\n      key = \\\"bad\\\"; verdict = \\\"합격 가능성 낮음\\\";\\n      desc = \\\"최근 2년 1차 합격선에 미치지 못해요. 다른 학교와 함께 신중하게 검토해 보세요.\\\";\\n    }\\n    banner.className = \\\"banner \\\" + key;\\n    document.getElementById(\\\"verdict\\\").textContent = verdict;\\n    document.getElementById(\\\"verdictDesc\\\").textContent = desc;\\n\\n    document.getElementById(\\\"kScore\\\").textContent = fmt(score) + \\\"점\\\";\\n    document.getElementById(\\\"kBonus\\\").textContent = bonus > 0 ? \\\"가산점 \\\" + bonus + \\\"점 보유 — 경계 구간에서 유리\\\" : \\\"가산점 없음\\\";\\n    var d0 = results[0].diff;\\n    var kd = document.getElementById(\\\"kDiff\\\");\\n    kd.textContent = fmtDiff(d0);\\n    kd.className = \\\"v \\\" + (d0 >= 0 ? \\\"pos\\\" : \\\"neg\\\");\\n    document.getElementById(\\\"kDiffS\\\").textContent = \\\"합격선 \\\" + fmt(CFG.years[0].cutoff) + \\\"점\\\";\\n    document.getElementById(\\\"kRank\\\").textContent = \\\"약 \\\" + results[0].rank + \\\"등\\\";\\n\\n    var anyExample = CFG.years.some(function (y) { return y.example; });\\n    document.getElementById(\\\"exampleWarn\\\").style.display = anyExample ? \\\"block\\\" : \\\"none\\\";\\n\\n    var html = \\\"\\\";\\n    for (var j = 0; j < CFG.years.length; j++) {\\n      var y = CFG.years[j], r = results[j];\\n      var lo = Math.max(0, Math.min(y.cutoff, score) - 15);\\n      var hi = Math.min(CFG.subjectMax, Math.max(y.avg, score) + 10);\\n      var pc = pctPos(y.cutoff, lo, hi), pa = pctPos(y.avg, lo, hi), pm = pctPos(score, lo, hi);\\n      html += '<div class=\\\"yr\\\">' +\\n        '<div class=\\\"yr-head\\\"><h3>' + y.year + '학년도<span>' + y.label + ' · 1차 ' + y.ratio + '배수 선발<\\/span><\\/h3>' +\\n        '<span class=\\\"badge ' + r.key + '\\\">' + r.level + '<\\/span><\\/div>' +\\n        '<div class=\\\"bar\\\">' +\\n          '<div class=\\\"zone-bad\\\" style=\\\"width:' + pc + '%\\\"><\\/div>' +\\n          '<div class=\\\"zone-ok\\\" style=\\\"left:' + pc + '%;width:' + (pa - pc) + '%\\\"><\\/div>' +\\n          '<div class=\\\"zone-hi\\\" style=\\\"left:' + pa + '%\\\"><\\/div>' +\\n          '<div class=\\\"mark\\\" style=\\\"left:' + pc + '%\\\"><div class=\\\"lb\\\">합격선 ' + fmt(y.cutoff) + '<\\/div><\\/div>' +\\n          '<div class=\\\"mark\\\" style=\\\"left:' + pa + '%\\\"><div class=\\\"lb\\\">평균 ' + fmt(y.avg) + '<\\/div><\\/div>' +\\n          '<div class=\\\"me\\\" style=\\\"left:' + pm + '%\\\"><div class=\\\"lb\\\">내 점수 ' + fmt(score) + '<\\/div><\\/div>' +\\n        '<\\/div>' +\\n        '<div class=\\\"grid4\\\">' +\\n          '<div class=\\\"cell\\\">1차 합격선<b>' + fmt(y.cutoff) + '점<\\/b><\\/div>' +\\n          '<div class=\\\"cell\\\">합격자 평균<b>' + fmt(y.avg) + '점' + (y.example ? ' <span style=\\\"color:var(--mid);font-size:12.6px\\\">(예시)<\\/span>' : '') + '<\\/b><\\/div>' +\\n          '<div class=\\\"cell\\\">합격선과 차이<b class=\\\"' + (r.diff >= 0 ? 'pos' : 'neg') + '\\\">' + fmtDiff(r.diff) + '<\\/b><\\/div>' +\\n          '<div class=\\\"cell\\\">합격자 100명 중<b>약 ' + r.rank + '등<\\/b><\\/div>' +\\n        '<\\/div>' +\\n      '<\\/div>';\\n    }\\n    document.getElementById(\\\"years\\\").innerHTML = html;\\n    var res = document.getElementById(\\\"result\\\");\\n    res.style.display = \\\"block\\\";\\n    res.scrollIntoView({ behavior: \\\"smooth\\\", block: \\\"start\\\" });\\n  }\\n\\n  function buildSettings() {\\n    var g = document.getElementById(\\\"setGrid\\\");\\n    var h = \\\"\\\";\\n    for (var i = 0; i < CFG.years.length; i++) {\\n      var y = CFG.years[i];\\n      h += '<h4>' + y.year + '학년도 (' + y.label + ')<\\/h4>' +\\n        '<div><label>1차 합격선<\\/label><input type=\\\"number\\\" step=\\\"0.01\\\" id=\\\"s_cut' + i + '\\\" value=\\\"' + y.cutoff + '\\\"><\\/div>' +\\n        '<div><label>합격자 평균<\\/label><input type=\\\"number\\\" step=\\\"0.01\\\" id=\\\"s_avg' + i + '\\\" value=\\\"' + y.avg + '\\\"><\\/div>' +\\n        '<div><label>표준편차 (모르면 비움)<\\/label><input type=\\\"number\\\" step=\\\"0.01\\\" id=\\\"s_sd' + i + '\\\" value=\\\"' + (y.sd || '') + '\\\"><\\/div>' +\\n        '<div><label>1차 선발 배수<\\/label><input type=\\\"number\\\" step=\\\"0.1\\\" id=\\\"s_ratio' + i + '\\\" value=\\\"' + y.ratio + '\\\"><\\/div>';\\n    }\\n    h += '<h4>공통<\\/h4>' +\\n      '<div><label>교과 만점<\\/label><input type=\\\"number\\\" id=\\\"s_max\\\" value=\\\"' + CFG.subjectMax + '\\\"><\\/div>' +\\n      '<div><label>경계 범위 (합격선 − n점)<\\/label><input type=\\\"number\\\" step=\\\"0.5\\\" id=\\\"s_border\\\" value=\\\"' + CFG.borderline + '\\\"><\\/div>';\\n    g.innerHTML = h;\\n  }\\n\\n  function applySettings() {\\n    for (var i = 0; i < CFG.years.length; i++) {\\n      var y = CFG.years[i];\\n      var c = parseFloat(document.getElementById(\\\"s_cut\\\" + i).value);\\n      var a = parseFloat(document.getElementById(\\\"s_avg\\\" + i).value);\\n      var s = parseFloat(document.getElementById(\\\"s_sd\\\" + i).value);\\n      var r = parseFloat(document.getElementById(\\\"s_ratio\\\" + i).value);\\n      if (!isNaN(c)) y.cutoff = c;\\n      if (!isNaN(a)) {\\n        if (a !== DEFAULTS.years[i].avg) y.example = false;\\n        y.avg = a;\\n      }\\n      y.sd = isNaN(s) ? null : s;\\n      if (!isNaN(r)) y.ratio = r;\\n    }\\n    var m = parseFloat(document.getElementById(\\\"s_max\\\").value);\\n    if (!isNaN(m) && m > 0) CFG.subjectMax = m;\\n    var b = parseFloat(document.getElementById(\\\"s_border\\\").value);\\n    if (!isNaN(b)) CFG.borderline = b;\\n    document.getElementById(\\\"score\\\").max = CFG.subjectMax;\\n    document.getElementById(\\\"maxLabel\\\").textContent = \\\"(\\\" + CFG.subjectMax + \\\"점 만점)\\\";\\n    document.getElementById(\\\"setMsg\\\").textContent = \\\"적용됐어요.\\\";\\n    setTimeout(function () { document.getElementById(\\\"setMsg\\\").textContent = \\\"\\\"; }, 2000);\\n    if (document.getElementById(\\\"result\\\").style.display === \\\"block\\\") run();\\n  }\\n\\n  function resetSettings() {\\n    CFG = JSON.parse(JSON.stringify(DEFAULTS));\\n    buildSettings();\\n    document.getElementById(\\\"score\\\").max = CFG.subjectMax;\\n    document.getElementById(\\\"maxLabel\\\").textContent = \\\"(\\\" + CFG.subjectMax + \\\"점 만점)\\\";\\n    if (document.getElementById(\\\"result\\\").style.display === \\\"block\\\") run();\\n  }\\n\\n  document.getElementById(\\\"score\\\").addEventListener(\\\"keydown\\\", function (e) {\\n    if (e.key === \\\"Enter\\\") run();\\n  });\\n  buildSettings();\\n<\\/script>\\n<\\/body>\\n<\\/html>\\n\", \"heunghae\": \"<!DOCTYPE html>\\n<html lang=\\\"ko\\\">\\n<head>\\n<meta charset=\\\"UTF-8\\\">\\n<meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1.0\\\">\\n<title>포항흥해공업고등학교 합격 가능성 예측<\\/title>\\n<style>\\n  :root{\\n    --blue:var(--tp,#1f6fd1); --blue-dark:var(--tp2,#174a96); --blue-light:var(--ts,#edf3fc);\\n    --paper:#f4f6fb; --card:#ffffff; --line:#e3e8f2; --ink:#1d2433; --muted:#66707d;\\n    --hi:#3f9d6e; --hi-bg:#e8f7ee;\\n    --good:#3f9d6e; --good-bg:#eef8ef;\\n    --mid:#a8720a; --mid-bg:#fff6e6;\\n    --bad:#cf5f74; --bad-bg:#fdeceb;\\n  }\\n  *{box-sizing:border-box}\\n  html{height:100%}\\n  body{\\n    margin:0;min-height:100vh;color:var(--ink);\\n    font-family:\\\"Pretendard\\\",\\\"Malgun Gothic\\\",\\\"Apple SD Gothic Neo\\\",sans-serif;line-height:1.5;\\n    background:linear-gradient(180deg,var(--blue-light) 0%,var(--paper) 320px,var(--paper) 100%);\\n    display:flex;justify-content:center;\\n  }\\n  .wrap{width:100%;max-width:1680px;margin:0 auto;padding:clamp(14px,3vw,32px) clamp(14px,4vw,28px) 90px}\\n\\n  .hero{display:flex;gap:clamp(14px,3vw,28px);align-items:center;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:14px;padding:clamp(18px,3vw,28px) clamp(18px,4vw,32px);box-shadow:0 4px 18px rgba(15,42,77,.06)}\\n  .hero .logo{width:clamp(56px,7vw,80px);height:clamp(56px,7vw,80px);flex:0 0 auto;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--blue-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(22px,3vw,30px)}\\n  .hero .kicker{font-size:13.8px;letter-spacing:.12em;color:var(--blue);font-weight:700;text-transform:uppercase}\\n  .hero h1{margin:2px 0 4px;font-size:clamp(20px,2.6vw,28px);letter-spacing:-.01em}\\n  .hero p{margin:0;color:var(--muted);font-size:16.1px}\\n\\n  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}\\n  .steps div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.9px;text-align:center;color:var(--blue-dark);font-weight:600}\\n\\n  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,24px);margin-top:16px}\\n  .panel h2{margin:0 0 4px;font-size:20.7px;color:var(--blue-dark)}\\n  .panel .sub{margin:0 0 16px;font-size:14.9px;color:var(--muted)}\\n  .sub-note{background:var(--blue-light);border-radius:8px;padding:10px 12px;font-size:14.4px;color:var(--tp2,#174a96);margin-bottom:14px}\\n\\n  .apply-link{display:inline-block;margin-top:2px;font-size:14.4px;color:var(--blue-dark);text-decoration:underline}\\n\\n  .sem-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}\\n  .sem-card{border:1px solid var(--line);border-radius:10px;padding:12px}\\n  .sem-card h3{margin:0 0 8px;font-size:15.5px;color:var(--blue-dark)}\\n  .sem-card .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:14.9px}\\n  .sem-card select{padding:5px 6px;border:1px solid var(--line);border-radius:6px;font-size:14.9px}\\n  .subj-hint{font-size:12.1px;color:var(--muted);margin:-2px 0 6px;line-height:1.4}\\n\\n  .att-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0 4px}\\n  .att-field{display:flex;flex-direction:column;gap:4px}\\n  .att-field label{font-size:14.4px;font-weight:600;color:var(--ink)}\\n  .att-field .hint{font-size:12.1px;color:var(--muted)}\\n  .att-field input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:16.1px;width:140px}\\n\\n  .live-score{display:flex;align-items:center;justify-content:space-between;background:var(--blue-light);border-radius:10px;padding:12px 16px;margin-top:12px;font-size:16.1px}\\n  .live-score b{font-size:27.6px;color:var(--blue-dark)}\\n  .live-score .zero-warn{display:none;color:var(--bad);font-size:13.8px;font-weight:700;margin-top:6px}\\n\\n  .track-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0}\\n  .track-card{border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s, background .15s}\\n  .track-card.sel{border-color:var(--blue);background:var(--blue-light)}\\n  .track-card h4{margin:0 0 6px;font-size:17.2px;color:var(--blue-dark)}\\n  .track-card p{margin:0;font-size:14.4px;color:var(--muted)}\\n\\n  .dept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}\\n  .dept-card{border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s, background .15s}\\n  .dept-card.sel{border-color:var(--blue);background:var(--blue-light)}\\n  .dept-card h5{margin:0 0 4px;font-size:15.5px;color:var(--blue-dark)}\\n  .dept-card p{margin:0;font-size:13.2px;color:var(--muted)}\\n\\n  .go-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}\\n  .go{padding:13px 26px;font-size:17.2px;font-weight:700;background:var(--blue);color:#fff;border:none;border-radius:9px;cursor:pointer}\\n  .go:hover{background:var(--blue-dark)}\\n  .go-row .note{font-size:13.8px;color:var(--muted)}\\n  .err{display:none;color:var(--bad);font-size:14.9px;margin-top:8px}\\n\\n  #result{display:none}\\n  .result-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}\\n  .print-btn{background:var(--blue);color:#fff;border:none;font-weight:800;font-size:16.1px;padding:11px 20px;border-radius:9px;cursor:pointer}\\n  .print-btn:hover{background:var(--blue-dark)}\\n  .result-toolbar .note{font-size:13.8px;color:var(--muted)}\\n  .print-header{display:none}\\n\\n  .banner{border-radius:14px;padding:20px 24px;display:flex;gap:18px;align-items:center;border:1px solid transparent}\\n  .banner .tag{font-size:13.8px;font-weight:700;letter-spacing:.08em;opacity:.8}\\n  .banner .verdict{font-size:27.6px;font-weight:800;margin:2px 0}\\n  .banner .desc{font-size:16.1px;margin:0}\\n  .banner.hi{background:var(--hi-bg);color:var(--hi);border-color:#b9dba0}\\n  .banner.good{background:var(--good-bg);color:var(--good);border-color:#bfe0c2}\\n  .banner.mid{background:var(--mid-bg);color:var(--mid);border-color:#f1dea0}\\n  .banner.bad{background:var(--bad-bg);color:var(--bad);border-color:#f3c1c1}\\n\\n  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}\\n  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}\\n  .kpi .l{font-size:13.8px;color:var(--muted)}\\n  .kpi .v{font-size:23px;font-weight:800;color:var(--blue-dark)}\\n  .kpi .s{font-size:13.2px;color:var(--muted);margin-top:2px}\\n\\n  table.hist{width:100%;border-collapse:collapse;font-size:14.9px;margin:12px 0}\\n  table.hist th,table.hist td{border:1px solid var(--line);padding:8px 6px;text-align:center}\\n  table.hist th{background:var(--blue-light);color:var(--blue-dark)}\\n\\n  .method{background:var(--blue-light);border-radius:10px;padding:14px 16px;font-size:14.9px;color:var(--tp2,#174a96);margin-top:12px}\\n  .method b{color:var(--blue-dark)}\\n  .method ul{margin:6px 0 0;padding-left:18px}\\n  .method li{margin-bottom:5px}\\n\\n  .warn2{background:var(--mid-bg);color:var(--mid);border-radius:10px;padding:12px 14px;font-size:14.9px;margin:12px 0;font-weight:600}\\n  .warn3{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:12px 14px;font-size:14.9px;margin:12px 0;font-weight:700}\\n\\n  details.settings{margin-top:18px;border:1px dashed var(--line);border-radius:10px;padding:10px 14px;background:#f8f9fd}\\n  details.settings summary{cursor:pointer;font-size:14 input type=\\\"number\\\" id=\\\"absentDays\\\" min=\\\"0\\\" step=\\\"1\\\" value=\\\"0\\\">\\n        <span class=\\\"hint\\\">1일당 -3점<\\/span>\\n      <\\/div>\\n      <div class=\\\"att-field\\\">\\n        <label for=\\\"otherCount\\\">무단지각·조퇴·결과 횟수(합계)<\\/label>\\n        <input type=\\\"number\\\" id=\\\"otherCount\\\" min=\\\"0\\\" step=\\\"1\\\" value=\\\"0\\\">\\n        <span class=\\\"hint\\\">1회당 -1점 (3개 학년 반영)<\\/span>\\n      <\\/div>\\n    <\\/div>\\n\\n    <div class=\\\"live-score\\\">\\n      <span>계산된 1차 전형 총점 (100점 만점)<\\/span>\\n      <b id=\\\"liveScore\\\">100.0<\\/b>\\n    <\\/div>\\n    <div class=\\\"zero-warn\\\" id=\\\"zeroWarn\\\">⚠ 출석 성적이 0점입니다. 이 경우 교과 성적과 무관하게 <b>불합격<\\/b> 처리돼요.<\\/div>\\n  <\\/section>\\n\\n  <section class=\\\"panel\\\">\\n    <h2>2. 지원 전형 선택<\\/h2>\\n    <p class=\\\"sub\\\">두 전형 모두 산출 방식은 동일하지만(교과 70 + 출결 30), 지원 자격과 모집 인원 비중이 달라 통과선이 다를 수 있어요. 기준값은 아래 ⚙설정에서 각각 조정할 수 있어요.<\\/p>\\n    <div class=\\\"track-grid\\\" id=\\\"trackGrid\\\">\\n      <div class=\\\"track-card\\\" data-track=\\\"special\\\">\\n        <h4>취업희망자 특별전형<\\/h4>\\n        <p>2026학년도 중학교 졸업예정자로 취업 의지가 명확한 자. 전체 정원 140명 중 126명(90%) 배정.<\\/p>\\n      <\\/div>\\n      <div class=\\\"track-card\\\" data-track=\\\"general\\\">\\n        <h4>일반전형<\\/h4>\\n        <p>졸업(예정)자·검정고시 합격자 등. 전체 정원 140명 중 14명(10%) 배정.<\\/p>\\n      <\\/div>\\n    <\\/div>\\n\\n    <h2 style=\\\"margin-top:18px\\\">3. 희망 학과 선택 <span style=\\\"font-weight:400;font-size:14.4px;color:var(--muted)\\\">(선택 사항 — 정원 참고용)<\\/span><\\/h2>\\n    <p class=\\\"sub\\\">학과별 통과선 자료는 따로 없어서 예측 확률에는 반영되지 않아요. 다만 최대 3지망까지 지원 가능하며, 학과배정은 성적순으로 이뤄져요.<\\/p>\\n    <div class=\\\"dept-grid\\\" id=\\\"deptGrid\\\"><\\/div>\\n\\n    <div class=\\\"go-row\\\">\\n      <button class=\\\"go\\\" onclick=\\\"run()\\\">판정하기<\\/button>\\n      <span class=\\\"note\\\">입력한 성적은 저장되지 않고 새로고침하면 사라져요.<\\/span>\\n    <\\/div>\\n    <div class=\\\"err\\\" id=\\\"err\\\">전형을 선택했는지 확인해주세요.<\\/div>\\n  <\\/section>\\n\\n  <section id=\\\"result\\\">\\n    <div class=\\\"result-toolbar no-print\\\">\\n      <button class=\\\"print-btn\\\" onclick=\\\"window.print()\\\">🖨 결과 인쇄 / PDF로 저장<\\/button>\\n      <span class=\\\"note\\\">인쇄 대화상자에서 \\\"PDF로 저장\\\"을 선택하면 파일로도 저장할 수 있어요.<\\/span>\\n    <\\/div>\\n    <div class=\\\"print-header\\\">\\n      <span id=\\\"printTitle\\\">포항흥해공업고등학교 합격 가능성 예측 결과<\\/span>\\n      <span id=\\\"printDate\\\"><\\/span>\\n    <\\/div>\\n\\n    <div class=\\\"banner\\\" id=\\\"banner\\\">\\n      <div>\\n        <div class=\\\"tag\\\" id=\\\"bannerTag\\\">1단계(1차 전형 통과) 종합 판정<\\/div>\\n        <div class=\\\"verdict\\\" id=\\\"verdict\\\">-<\\/div>\\n        <p class=\\\"desc\\\" id=\\\"verdictDesc\\\">-<\\/p>\\n      <\\/div>\\n    <\\/div>\\n\\n    <div class=\\\"kpis\\\">\\n      <div class=\\\"kpi\\\"><div class=\\\"l\\\">내 1차 전형 총점 (100점 만점)<\\/div><div class=\\\"v\\\" id=\\\"kScore\\\">-<\\/div><div class=\\\"s\\\" id=\\\"kBreak\\\"><\\/div><\\/div>\\n      <div class=\\\"kpi\\\"><div class=\\\"l\\\" id=\\\"kDiffLabel1\\\">작년 통과선과 차이<\\/div><div class=\\\"v\\\" id=\\\"kDiff1\\\">-<\\/div><div class=\\\"s\\\" id=\\\"kDiff1s\\\"><\\/div><\\/div>\\n      <div class=\\\"kpi\\\"><div class=\\\"l\\\">희망 학과 정원<\\/div><div class=\\\"v\\\" id=\\\"kDept\\\">-<\\/div><div class=\\\"s\\\" id=\\\"kDeptS\\\"><\\/div><\\/div>\\n      <div class=\\\"kpi\\\"><div class=\\\"l\\\" id=\\\"kProbLabel\\\">1차 통과 예상 확률<\\/div><div class=\\\"v\\\" id=\\\"kProb\\\">-<\\/div><div class=\\\"s\\\" id=\\\"kProbS\\\"><\\/div><\\/div>\\n    <\\/div>\\n\\n    <table class=\\\"hist\\\" id=\\\"histTable\\\">\\n      <thead><tr><th>기준 연도<\\/th><th>선발 배수<\\/th><th>전체 정원<\\/th><th id=\\\"cutoffColLabel\\\">1차 통과선(추정)<\\/th><\\/tr><\\/thead>\\n      <tbody id=\\\"histBody\\\"><\\/tbody>\\n    <\\/table>\\n\\n    <div class=\\\"warn3\\\" id=\\\"failWarn\\\" style=\\\"display:none\\\">\\n      ⚠ 무단결석·지각·조퇴·결과로 인해 출석 성적이 0점으로 계산돼요. 모집요강상 <b>출석 성적이 0점이면 교과 성적과 관계없이 불합격<\\/b> 처리되니, 실제 출결 기록을 꼭 다시 확인해 보세요.\\n    <\\/div>\\n\\n    <div class=\\\"method\\\" id=\\\"methodBox\\\"><\\/div>\\n\\n    <details class=\\\"settings no-print\\\">\\n      <summary>⚙ 기준값 설정 (통과선 추정치를 직접 조정하고 싶다면 펼치세요)<\\/summary>\\n      <div class=\\\"set-body\\\">\\n        <div class=\\\"set-grid\\\" id=\\\"setGrid\\\"><\\/div>\\n        <button onclick=\\\"applySettings()\\\">적용<\\/button>\\n        <button onclick=\\\"resetSettings()\\\">기본값으로<\\/button>\\n        <span class=\\\"msg\\\" id=\\\"setMsg\\\"><\\/span>\\n      <\\/div>\\n    <\\/details>\\n  <\\/section>\\n\\n<\\/div>\\n\\n\\n\\n<div class=\\\"egg-overlay no-print\\\" id=\\\"eggOverlay\\\" onclick=\\\"closeEgg(event)\\\">\\n  <div class=\\\"egg-box\\\">\\n    <h3 id=\\\"eggTitle\\\">화이팅!<\\/h3>\\n    <p id=\\\"eggMsg\\\">이 프로그램을 쓰는 모든 학생의 합격을 응원합니다. 결과는 참고용일 뿐, 진짜 실력은 마지막까지 최선을 다하는 마음이에요 🎉<\\/p>\\n    <button onclick=\\\"closeEgg(event)\\\">고마워요<\\/button>\\n  <\\/div>\\n<\\/div>\\n\\n<script>\\n  // 국어·수학·과학·영어·기술가정(미개설시 정보) — 모두 동일 비중으로 평균\\n  var SUBJECTS = [\\n    { key: \\\"kor\\\", label: \\\"국어\\\" },\\n    { key: \\\"math\\\", label: \\\"수학\\\" },\\n    { key: \\\"sci\\\", label: \\\"과학\\\" },\\n    { key: \\\"eng\\\", label: \\\"영어\\\" },\\n    { key: \\\"tech\\\", label: \\\"기술·가정\\\", hint: \\\"미개설 시 '정보' 교과 성적으로 대체\\\" }\\n  ];\\n  // 2학년1학기(21점/30%), 2학년2학기(21점/30%), 3학년1학기(28점/40%) — 3학년 2학기는 성적 산출 기준일 이전이라 미반영\\n  var SEMESTERS = [\\n    { key: \\\"g2s1\\\", label: \\\"2학년 1학기\\\", points: 21 },\\n    { key: \\\"g2s2\\\", label: \\\"2학년 2학기\\\", points: 21 },\\n    { key: \\\"g3s1\\\", label: \\\"3학년 1학기\\\", points: 28 }\\n  ];\\n  var GRADE_POINT = { A: 5, B: 4, C: 3, D: 2, E: 1 };\\n\\n  var DEPTS = [\\n    { key: \\\"mech\\\", label: \\\"이차전지기계설비과\\\", classes: 2, total: 40, special: 36, general: 4 },\\n    { key: \\\"sys\\\", label: \\\"이차전지시스템제어과\\\", classes: 2, total: 40, special: 36, general: 4 },\\n    { key: \\\"elec\\\", label: \\\"이차전지전기설비과\\\", classes: 3, total: 60, special: 54, general: 6 }\\n  ];\\n\\n  // ---- default historical assumption (editable via settings panel) ----\\n  // 작년(2026학년도) 기준: 총점(교과+출결) 54점이 1차 전형 통과선(1.2배수)이었다는\\n  // 사용자 제공 정보를 기본값으로 반영. 특별전형/일반전형 각각 조정 가능.\\n  var DEFAULTS = {\\n    special: {\\n      label: \\\"취업희망자 특별전형\\\",\\n      cutoff: 54, sd: 6,\\n      cutSubject: 24, cutAtt: 30,\\n      quota: 126\\n    },\\n    general: {\\n      label: \\\"일반전형\\\",\\n      cutoff: 54, sd: 6,\\n      cutSubject: 24, cutAtt: 30,\\n      quota: 14\\n    }\\n  };\\n  var CFG = JSON.parse(JSON.stringify(DEFAULTS));\\n\\n  // ---------- build semester/subject inputs ----------\\n  function buildSemGrid() {\\n    var grid = document.getElementById(\\\"semGrid\\\");\\n    grid.innerHTML = \\\"\\\";\\n    SEMESTERS.forEach(function (sem) {\\n      var card = document.createElement(\\\"div\\\");\\n      card.className = \\\"sem-card\\\";\\n      var h = document.createElement(\\\"h3\\\");\\n      h.textContent = sem.label + \\\" (\\\" + sem.points + \\\"점)\\\";\\n      card.appendChild(h);\\n      SUBJECTS.forEach(function (subj) {\\n        var row = document.createElement(\\\"div\\\");\\n        row.className = \\\"row\\\";\\n        var lab = document.createElement(\\\"span\\\");\\n        lab.textContent = subj.hint ? (subj.label + \\\" *\\\") : subj.label;\\n        if (subj.hint) lab.title = subj.hint;\\n        var sel = document.createElement(\\\"select\\\");\\n        sel.id = sem.key + \\\"_\\\" + subj.key;\\n        [\\\"A\\\", \\\"B\\\", \\\"C\\\", \\\"D\\\", \\\"E\\\"].forEach(function (g) {\\n          var opt = document.createElement(\\\"option\\\");\\n          opt.value = g;\\n          opt.textContent = g;\\n          sel.appendChild(opt);\\n        });\\n        sel.addEventListener(\\\"change\\\", updateLiveScore);\\n        row.appendChild(lab);\\n        row.appendChild(sel);\\n        card.appendChild(row);\\n        if (subj.hint) {\\n          var hintRow = document.createElement(\\\"div\\\");\\n          hintRow.className = \\\"subj-hint\\\";\\n          hintRow.textContent = \\\"* \\\" + subj.hint;\\n          card.appendChild(hintRow);\\n        }\\n      });\\n      grid.appendChild(card);\\n    });\\n  }\\n\\n  // ---------- department cards ----------\\n  function buildDeptGrid() {\\n    var grid = document.getElementById(\\\"deptGrid\\\");\\n    grid.innerHTML = \\\"\\\";\\n    DEPTS.forEach(function (d) {\\n      var card = document.createElement(\\\"div\\\");\\n      card.className = \\\"dept-card\\\";\\n      card.setAttribute(\\\"data-dept\\\", d.key);\\n      var h = document.createElement(\\\"h5\\\");\\n      h.textContent = d.label;\\n      var p = document.createElement(\\\"p\\\");\\n      p.textContent = \\\"정원 \\\" + d.total + \\\"명 (특별 \\\" + d.special + \\\" · 일반 \\\" + d.general + \\\") · \\\" + d.classes + \\\"학급\\\";\\n      card.appendChild(h);\\n      card.appendChild(p);\\n      grid.appendChild(card);\\n    });\\n  }\\n\\n  var selectedDept = null;\\n  document.addEventListener(\\\"DOMContentLoaded\\\", function () {\\n    var grid = document.getElementById(\\\"deptGrid\\\");\\n    grid.addEventListener(\\\"click\\\", function (e) {\\n      var card = e.target.closest(\\\".dept-card\\\");\\n      if (!card) return;\\n      var key = card.getAttribute(\\\"data-dept\\\");\\n      if (selectedDept === key) {\\n        // toggle off (선택 사항이므로 다시 눌러 해제 가능)\\n        selectedDept = null;\\n        document.querySelectorAll(\\\".dept-card\\\").forEach(function (c) { c.classList.remove(\\\"sel\\\"); });\\n        return;\\n      }\\n      document.querySelectorAll(\\\".dept-card\\\").forEach(function (c) { c.classList.remove(\\\"sel\\\"); });\\n      card.classList.add(\\\"sel\\\");\\n      selectedDept = key;\\n    });\\n  });\\n\\n  function attendanceScore(absentDays, otherCount) {\\n    var raw = 30 - (absentDays * 3 + otherCount * 1);\\n    return Math.max(0, raw);\\n  }\\n\\n  function computeSubjectScore() {\\n    var total = 0;\\n    SEMESTERS.forEach(function (sem) {\\n      var sum = 0;\\n      SUBJECTS.forEach(function (subj) {\\n        var el = document.getElementById(sem.key + \\\"_\\\" + subj.key);\\n        sum += GRADE_POINT[el.value];\\n      });\\n      var avg = sum / SUBJECTS.length; // 1~5\\n      total += (avg / 5) * sem.points;\\n    });\\n    return total; // 최대 70\\n  }\\n\\n  function updateLiveScore() {\\n    var subjectScore = computeSubjectScore();\\n    var absentDays = Math.max(0, parseInt(document.getElementById(\\\"absentDays\\\").value, 10) || 0);\\n    var otherCount = Math.max(0, parseInt(document.getElementById(\\\"otherCount\\\").value, 10) || 0);\\n    var attRaw = 30 - (absentDays * 3 + otherCount * 1);\\n    var att = Math.max(0, attRaw);\\n    var total = subjectScore + att;\\n    document.getElementById(\\\"liveScore\\\").textContent = total.toFixed(1);\\n    document.getElementById(\\\"zeroWarn\\\").style.display = (attRaw <= 0) ? \\\"block\\\" : \\\"none\\\";\\n    return { subjectScore: subjectScore, att: att, attRaw: attRaw, total: total };\\n  }\\n\\n  document.getElementById(\\\"absentDays\\\").addEventListener(\\\"change\\\", updateLiveScore);\\n  document.getElementById(\\\"absentDays\\\").addEventListener(\\\"input\\\", updateLiveScore);\\n  document.getElementById(\\\"otherCount\\\").addEventListener(\\\"change\\\", updateLiveScore);\\n  document.getElementById(\\\"otherCount\\\").addEventListener(\\\"input\\\", updateLiveScore);\\n\\n  // ---------- track selection ----------\\n  var selectedTrack = null;\\n  document.getElementById(\\\"trackGrid\\\").addEventListener(\\\"click\\\", function (e) {\\n    var card = e.target.closest(\\\".track-card\\\");\\n    if (!card) return;\\n    document.querySelectorAll(\\\".track-card\\\").forEach(function (c) { c.classList.remove(\\\"sel\\\"); });\\n    card.classList.add(\\\"sel\\\");\\n    selectedTrack = card.getAttribute(\\\"data-track\\\");\\n  });\\n\\n  // ---------- normal distribution helper ----------\\n  function erf(x) {\\n    var sign = x < 0 ? -1 : 1;\\n    x = Math.abs(x);\\n    var a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741,\\n        a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;\\n    var t = 1 / (1 + p * x);\\n    var y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);\\n    return sign * y;\\n  }\\n  function normCdf(x, mean, sd) {\\n    return 0.5 * (1 + erf((x - mean) / (sd * Math.sqrt(2))));\\n  }\\n\\n  // ---------- settings panel ----------\\n  function buildSettings() {\\n    var grid = document.getElementById(\\\"setGrid\\\");\\n    grid.innerHTML = \\\"\\\";\\n    function addHeader(text) {\\n      var h = document.createElement(\\\"h4\\\");\\n      h.textContent = text;\\n      grid.appendChild(h);\\n    }\\n    function addField(id, label, value) {\\n      var l = document.createElement(\\\"label\\\");\\n      l.textContent = label;\\n      var i = document.createElement(\\\"input\\\");\\n      i.type = \\\"number\\\";\\n      i.step = \\\"0.1\\\";\\n      i.id = id;\\n      i.value = value;\\n      grid.appendChild(l);\\n      grid.appendChild(i);\\n      grid.appendChild(document.createElement(\\\"span\\\"));\\n    }\\n    addHeader(\\\"취업희망자 특별전형 — 1차 전형 통과선 추정\\\");\\n    addField(\\\"set_s_cut\\\", \\\"작년 통과선(총점)\\\", CFG.special.cutoff);\\n    addField(\\\"set_s_sd\\\", \\\"변동폭(sd)\\\", CFG.special.sd);\\n\\n    addHeader(\\\"일반전형 — 1차 전형 통과선 추정\\\");\\n    addField(\\\"set_g_cut\\\", \\\"작년 통과선(총점)\\\", CFG.general.cutoff);\\n    addField(\\\"set_g_sd\\\", \\\"변동폭(sd)\\\", CFG.general.sd);\\n  }\\n\\n  function applySettings() {\\n    CFG.special.cutoff = parseFloat(document.getElementById(\\\"set_s_cut\\\").value);\\n    CFG.special.sd = parseFloat(document.getElementById(\\\"set_s_sd\\\").value);\\n    CFG.general.cutoff = parseFloat(document.getElementById(\\\"set_g_cut\\\").value);\\n    CFG.general.sd = parseFloat(document.getElementById(\\\"set_g_sd\\\").value);\\n    document.getElementById(\\\"setMsg\\\").textContent = \\\"적용되었습니다.\\\";\\n    setTimeout(function () { document.getElementById(\\\"setMsg\\\").textContent = \\\"\\\"; }, 2000);\\n  }\\n\\n  function resetSettings() {\\n    CFG = JSON.parse(JSON.stringify(DEFAULTS));\\n    buildSettings();\\n    document.getElementById(\\\"setMsg\\\").textContent = \\\"기본값으로 되돌렸습니다.\\\";\\n    setTimeout(function () { document.getElementById(\\\"setMsg\\\").textContent = \\\"\\\"; }, 2000);\\n  }\\n\\n  // ---------- main judge logic ----------\\n  function fmtDiff(diff) {\\n    var sign = diff >= 0 ? \\\"+\\\" : \\\"\\\";\\n    return sign + diff.toFixed(1) + \\\"점\\\";\\n  }\\n\\n  function run() {\\n    var err = document.getElementById(\\\"err\\\");\\n    if (!selectedTrack) {\\n      err.style.display = \\\"block\\\";\\n      document.getElementById(\\\"result\\\").style.display = \\\"none\\\";\\n      return;\\n    }\\n    err.style.display = \\\"none\\\";\\n\\n    var sc = updateLiveScore();\\n    var score = sc.total;\\n    var tc = CFG[selectedTrack];\\n\\n    var now = new Date();\\n    var pad = function (n) { return (n < 10 ? \\\"0\\\" : \\\"\\\") + n; };\\n    document.getElementById(\\\"printDate\\\").textContent =\\n      \\\"확인일: \\\" + now.getFullYear() + \\\"-\\\" + pad(now.getMonth() + 1) + \\\"-\\\" + pad(now.getDate()) +\\n      \\\" \\\" + pad(now.getHours()) + \\\":\\\" + pad(now.getMinutes());\\n\\n    document.getElementById(\\\"kScore\\\").textContent = score.toFixed(1) + \\\"점\\\";\\n    document.getElementById(\\\"kBreak\\\").textContent =\\n      \\\"교과 \\\" + sc.subjectScore.toFixed(1) + \\\" + 출결 \\\" + sc.att.toFixed(1);\\n\\n    var histBody = document.getElementById(\\\"histBody\\\");\\n    histBody.innerHTML =\\n      \\\"<tr><td>작년(2026)<\\/td><td>1.2배수<\\/td><td>140명<\\/td><td>\\\" + tc.cutoff.toFixed(0) + \\\"점 내외 (교과+출결 최종 점수)<\\/td><\\/tr>\\\" +\\n      \\\"<tr><td>올해(2027)<\\/td><td>1.2배수<\\/td><td>140명<\\/td><td>정원 변동 없음 — 작년과 유사할 것으로 추정<\\/td><\\/tr>\\\";\\n\\n    document.getElementById(\\\"kDiffLabel1\\\").textContent = \\\"작년 통과선과 차이\\\";\\n    var diff = score - tc.cutoff;\\n    document.getElementById(\\\"kDiff1\\\").textContent = fmtDiff(diff);\\n    document.getElementById(\\\"kDiff1s\\\").textContent = diff >= 0 ? \\\"통과선 이상\\\" : \\\"통과선 미만\\\";\\n\\n    var deptEl = document.getElementById(\\\"kDept\\\");\\n    var deptSEl = document.getElementById(\\\"kDeptS\\\");\\n    if (selectedDept) {\\n      var d = DEPTS.filter(function (x) { return x.key === selectedDept; })[0];\\n      deptEl.textContent = d.total + \\\"명\\\";\\n      deptSEl.textContent = d.label + \\\" (특별 \\\" + d.special + \\\" · 일반 \\\" + d.general + \\\")\\\";\\n    } else {\\n      deptEl.textContent = \\\"140명\\\";\\n      deptSEl.textContent = \\\"학과 미선택 (전체 정원)\\\";\\n    }\\n\\n    var banner = document.getElementById(\\\"banner\\\");\\n    var verdictEl = document.getElementById(\\\"verdict\\\");\\n    var descEl = document.getElementById(\\\"verdictDesc\\\");\\n    var bannerTag = document.getElementById(\\\"bannerTag\\\");\\n    var probLabel = document.getElementById(\\\"kProbLabel\\\");\\n    var probEl = document.getElementById(\\\"kProb\\\");\\n    var probS = document.getElementById(\\\"kProbS\\\");\\n    var failWarn = document.getElementById(\\\"failWarn\\\");\\n\\n    bannerTag.textContent = tc.label + \\\" · 1단계(1차 전형 통과) 종합 판정\\\";\\n    probLabel.textContent = \\\"1차 전형 통과 예상 확률\\\";\\n\\n    if (sc.attRaw <= 0) {\\n      // 출석 성적 0점 → 규정상 무조건 불합격\\n      failWarn.style.display = \\\"block\\\";\\n      banner.className = \\\"banner bad\\\";\\n      verdictEl.textContent = \\\"불합격 (출석 성적 0점)\\\";\\n      descEl.textContent = \\\"모집요강상 출석 성적이 0점이면 교과 성적과 관계없이 불합격 처리돼요.\\\";\\n      probEl.textContent = \\\"0%\\\";\\n      probS.textContent = \\\"출석 성적 0점 → 자동 불합격 규정 적용\\\";\\n    } else {\\n      failWarn.style.display = \\\"none\\\";\\n      var prob = normCdf(score, tc.cutoff, tc.sd);\\n      prob = Math.max(0.02, Math.min(0.98, prob));\\n      probEl.textContent = Math.round(prob * 100) + \\\"%\\\";\\n      probS.textContent = \\\"작년 1개년 자료 기준 추정치\\\";\\n\\n      var vkey, vlabel, vdesc;\\n      if (prob >= 0.75) { vkey = \\\"hi\\\"; vlabel = \\\"1차 통과 유력\\\"; vdesc = \\\"작년 통과선보다 여유 있게 높은 점수예요.\\\"; }\\n      else if (prob >= 0.45) { vkey = \\\"good\\\"; vlabel = \\\"1차 통과 가능성 높음\\\"; vdesc = \\\"통과선 근처거나 약간 위입니다. 안심하기보다 2차 전형(인·적성, 면접) 준비를 병행하세요.\\\"; }\\n      else if (prob >= 0.2) { vkey = \\\"mid\\\"; vlabel = \\\"경계선\\\"; vdesc = \\\"그 해 지원자 수준에 따라 결과가 갈릴 수 있는 위치예요.\\\"; }\\n      else { vkey = \\\"bad\\\"; vlabel = \\\"1차 통과 어려움\\\"; vdesc = \\\"작년 통과선보다 상당히 낮은 편이에요.\\\"; }\\n      banner.className = \\\"banner \\\" + vkey;\\n      verdictEl.textContent = vlabel;\\n      descEl.textContent = vdesc;\\n    }\\n\\n    document.getElementById(\\\"methodBox\\\").innerHTML =\\n      \\\"<b>이렇게 계산했어요<\\/b>\\\" +\\n      \\\"<ul>\\\" +\\n      \\\"<li>1차 전형은 <b>교과 성적(70점) + 출결 성적(30점) = 100점<\\/b> 총점 순으로 <b>모집 정원의 1.2배수<\\/b>를 선발해요. 여기서는 <b>1차 전형 통과(2차 전형 대상자 진출) 가능성<\\/b>을 예측합니다.<\\/li>\\\" +\\n      \\\"<li>교과 성적은 2학년 1학기(21점)·2학년 2학기(21점)·3학년 1학기(28점) 각 학기의 국어·수학·과학·영어·기술·가정(대체:정보) 5과목 성취도 평점(A=5~E=1) 평균을 배점에 비례해 환산한 값이에요.<\\/li>\\\" +\\n      \\\"<li>출결 점수는 <b>30 - (무단결석일수×3 + 무단지각·조퇴·결과 횟수×1)<\\/b>로 계산하며, 0점 미만은 0점으로 처리해요. <b>출석 성적이 0점이면 교과 성적과 무관하게 불합격<\\/b> 처리되는 규정을 그대로 반영했어요.<\\/li>\\\" +\\n      \\\"<li>작년(2026학년도) 1차 통과선은 제공해주신 자료(교과+출결 합산 최종 점수 54점)를 기본값으로 사용했고, 학생 점수를 정규분포 모델로 비교해 확률을 추정해요. <b>2개년이 아닌 1개년 자료<\\/b>라 변동폭(sd)을 다소 넉넉하게 잡았어요 — ⚙설정에서 직접 조정할 수 있어요.<\\/li>\\\" +\\n      \\\"<li>올해 정원은 140명(특별전형 126 · 일반전형 14)으로 <b>작년과 동일<\\/b>하다고 가정해 별도의 정원 보정은 하지 않았어요.<\\/li>\\\" +\\n      \\\"<li><b>1차 전형을 통과해도 최종 합격이 확정되는 것은 아니며<\\/b>, 2차 전형(인·적성검사 80점 + 심층면접 20점, 지원동기 10 + 태도 10)까지 합산한 총점(200점)으로 최종 합격자가 결정돼요. 2차 전형 점수는 공개되지 않아요.<\\/li>\\\" +\\n      \\\"<li>동점자는 ①교과 성적 → ②출결 → ③인·적성검사 → ④심층면접 순으로, 그래도 동점이면 3학년 1학기 수학·과학·국어·영어·기술가정 순으로 가려요.<\\/li>\\\" +\\n      \\\"<\\/ul>\\\";\\n\\n    document.getElementById(\\\"result\\\").style.display = \\\"block\\\";\\n    document.getElementById(\\\"result\\\").scrollIntoView({ behavior: \\\"smooth\\\", block: \\\"start\\\" });\\n\\n    var scoreLabel = document.getElementById(\\\"kScore\\\");\\n    if (score >= 99.95 && sc.attRaw > 0) {\\n      scoreLabel.innerHTML = score.toFixed(1) + \\\"점 <span class=\\\\\\\"perfect-badge\\\\\\\" onclick=\\\\\\\"celebratePerfect()\\\\\\\">만점 🎉<\\/span>\\\";\\n    }\\n  }\\n\\n  function openEgg() {\\n    document.getElementById(\\\"eggTitle\\\").textContent = \\\"화이팅!\\\";\\n    document.getElementById(\\\"eggMsg\\\").textContent = \\\"이 프로그램을 쓰는 모든 학생의 합격을 응원합니다. 결과는 참고용일 뿐, 진짜 실력은 마지막까지 최선을 다하는 마음이에요 🎉\\\";\\n    document.getElementById(\\\"eggOverlay\\\").classList.add(\\\"show\\\");\\n  }\\n  function closeEgg(e) {\\n    if (e && e.target && e.target.closest(\\\".egg-box\\\") && e.target.tagName !== \\\"BUTTON\\\") return;\\n    document.getElementById(\\\"eggOverlay\\\").classList.remove(\\\"show\\\");\\n  }\\n  function celebratePerfect() {\\n    document.getElementById(\\\"eggTitle\\\").textContent = \\\"만점입니다! 🎉\\\";\\n    document.getElementById(\\\"eggMsg\\\").textContent = \\\"100점 만점! 정말 대단해요. 그래도 2차 전형(인·적성검사, 심층면접)이 남아있으니 끝까지 화이팅입니다!\\\";\\n    document.getElementById(\\\"eggOverlay\\\").classList.add(\\\"show\\\");\\n  }\\n\\n  buildSemGrid();\\n  buildDeptGrid();\\n  buildSettings();\\n  updateLiveScore();\\n<\\/script>\\n\\n<\\/body>\\n<\\/html>\\n\", \"silla\": \"<!DOCTYPE html><html lang=\\\"ko\\\"><head><meta charset=\\\"UTF-8\\\"><meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1\\\">\\n<title>신라공고 합격 예측<\\/title>\\n<style>\\n:root{--ink:#1d2433;--sub:#475569;--muted:#8392A6;--ac:var(--tp,#1f6fd1);--bg:#F4F6FB;--line:#E3E8F2}\\n*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,\\\"Apple SD Gothic Neo\\\",\\\"Malgun Gothic\\\",\\\"Segoe UI\\\",sans-serif;line-height:1.55}\\n.wrap{max-width:1680px;margin:0 auto;padding:0 0 24px}\\n.linked{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:16.1px;margin-bottom:12px}\\n.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(15,42,77,.04),0 8px 24px rgba(15,42,77,.06)}\\n.verdict{border-radius:14px;padding:18px 20px;margin-bottom:14px}\\n.verdict .t{font-size:14.9px;font-weight:700;opacity:.8}.verdict .v{font-size:29.9px;font-weight:800;margin:2px 0 4px;letter-spacing:-.02em}.verdict .d{font-size:16.1px}\\n.v-hi{background:#e8f7ee;border:1px solid #9bd8b3;color:#2a6b4c}.v-mid{background:#fff6e0;border:1px solid #f0cf86;color:#7a4b00}.v-lo{background:#fdecec;border:1px solid #f1b4b4;color:#b84a5e}.v-na{background:#eef1f7;border:1px solid #d3dae8;color:#334155}\\n.bar{position:relative;height:14px;background:#e6ebf5;border-radius:99px;margin:26px 0 8px}\\n.bar i{position:absolute;top:0;left:0;height:100%;border-radius:99px;background:linear-gradient(90deg,#8fb4ec,var(--tp,#1f6fd1))}\\n.bar b{position:absolute;top:-22px;transform:translateX(-50%);font-size:13.2px;white-space:nowrap}\\n.bar u{position:absolute;top:-4px;width:3px;height:22px;background:#3f9d6e;border-radius:2px}\\n.bar s{position:absolute;top:-4px;width:3px;height:22px;background:#e0667c;border-radius:2px;text-decoration:none}\\n.ax{display:flex;justify-content:space-between;font-size:13.2px;color:var(--muted)}\\nh3{margin:18px 0 6px;font-size:16.1px}\\n.f{display:flex;gap:12px;flex-wrap:wrap}.f label{display:block;font-size:14.4px;font-weight:700;color:var(--sub);margin-bottom:4px}\\n.f input{width:150px;padding:9px 12px;border:1px solid #D5DBE9;border-radius:10px;font:inherit;font-weight:700}\\n.n{font-size:14.4px;color:var(--muted);margin:8px 0 0}\\nul{margin:6px 0 0;padding-left:18px;font-size:14.9px;color:var(--sub)}\\n<\\/style><\\/head><body><div class=\\\"wrap\\\"><div id=\\\"result\\\"><div class=\\\"card\\\"><p class=\\\"n\\\">성적을 입력하면 신라공업고 일반전형 예측이 표시됩니다.<\\/p><\\/div><\\/div><\\/div>\\n<script>\\n(function(){\\nvar K='silla_ref',ref={pass:79.2,fail:''};\\ntry{var s=JSON.parse(localStorage.getItem(K)||'null');if(s){ref.pass=s.pass;ref.fail=s.fail;}}catch(e){}\\nvar last=null;\\nfunction save(){try{localStorage.setItem(K,JSON.stringify(ref));}catch(e){}}\\nfunction num(v){var x=parseFloat(v);return isNaN(x)?null:x;}\\nfunction render(){\\n var r=document.getElementById('result');if(!last){return;}\\n var t=last.total,p=num(ref.pass),f=num(ref.fail),max=102,cls,head,desc;\\n if(last.att<=0){cls='v-lo';head='불합격 (출석 성적 0점)';desc='출석 성적이 0점이면 교과 성적과 관계없이 불합격 처리됩니다.';}\\n else if(p!==null&&t>=p){cls='v-hi';head='합격권';desc='예상 점수 '+t.toFixed(1)+'점이 합격 확인 점수 '+p+'점 이상입니다. 같은 전형에서 '+p+'점이 합격했으므로 그 이상이면 합격 가능성이 높습니다.';}\\n else if(f!==null&&t<=f){cls='v-lo';head='합격 어려움';desc='예상 점수 '+t.toFixed(1)+'점이 불합격 확인 점수 '+f+'점 이하입니다.';}\\n else if(p!==null){cls='v-mid';head='판단 보류 (경계)';desc='합격 확인 점수 '+p+'점보다 '+(p-t).toFixed(1)+'점 낮습니다. 실제 합격선이 '+p+'점 이하 어디인지는 확인된 자료가 없어 합격 여부를 판단할 수 없습니다.'+(f!==null?' (불합격 확인 점수 '+f+'점 초과)':'');}\\n else{cls='v-na';head='비교 자료 없음';desc='아래에 합격·불합격이 확인된 점수를 입력하면 비교해 드립니다.';}\\n var pct=Math.min(100,t/max*100);\\n var h='<div class=\\\"verdict '+cls+'\\\"><div class=\\\"t\\\">신라공업고 일반전형 · 예측<\\/div><div class=\\\"v\\\">'+head+'<\\/div><div class=\\\"d\\\">'+desc+'<\\/div><\\/div>';\\n h+='<div class=\\\"card\\\"><b>예상 점수 '+t.toFixed(1)+' / '+max+'점<\\/b> <span class=\\\"n\\\">(교과 '+last.ac.toFixed(1)+' + 출석 '+last.att+' + 봉사 '+last.sv+' + 주말 진로체험 '+last.trip+')<\\/span>';\\n h+='<div class=\\\"bar\\\"><i style=\\\"width:'+pct+'%\\\"><\\/i>';\\n if(p!==null)h+='<u style=\\\"left:'+Math.min(100,p/max*100)+'%\\\"><\\/u><b style=\\\"left:'+Math.min(100,p/max*100)+'%;color:#3f9d6e\\\">합격 '+p+'<\\/b>';\\n if(f!==null)h+='<s style=\\\"left:'+Math.min(100,f/max*100)+'%\\\"><\\/s>';\\n h+='<\\/div><div class=\\\"ax\\\"><span>0<\\/span><span>51<\\/span><span>102<\\/span><\\/div>';\\n h+='<h3>비교 기준 점수 (직접 수정 가능)<\\/h3><div class=\\\"f\\\"><div><label>합격이 확인된 점수 (최저)<\\/label><input type=\\\"number\\\" step=\\\"0.1\\\" id=\\\"rp\\\" value=\\\"'+(ref.pass===null||ref.pass===''?'':ref.pass)+'\\\"><\\/div><div><label>불합격이 확인된 점수 (최고)<\\/label><input type=\\\"number\\\" step=\\\"0.1\\\" id=\\\"rf\\\" value=\\\"'+(ref.fail===null||ref.fail===''?'':ref.fail)+'\\\" placeholder=\\\"없으면 비워두기\\\"><\\/div><\\/div>';\\n h+='<p class=\\\"n\\\">기본값 79.2점은 2027학년도 일반전형에서 합격한 학생의 환산점수(담임 확인)입니다. 요강에는 과거 합격선이 없어 이 값만으로 비교합니다.<\\/p>';\\n h+='<h3>참고 (2027학년도 요강)<\\/h3><ul><li>일반전형은 1차 성적(교과 40 + 출석 50 + 봉사 10 + 주말 진로체험 2 = 102점)만으로 선발합니다. 2차 전형(면접) 없음.<\\/li><li>모집 160명 중 특별전형 128명 우선 선발 후, 일반전형 32명 + 특별전형 미달 인원을 선발합니다. 일반전형 합격선은 특별전형 결과에 따라 달라질 수 있습니다.<\\/li><li>동점자: 출석 성적 → 교과 성적 순. 출석 성적 0점은 불합격입니다.<\\/li><\\/ul><\\/div>';\\n r.innerHTML=h;\\n var a=document.getElementById('rp'),b=document.getElementById('rf');\\n a.oninput=function(){ref.pass=a.value===''?null:parseFloat(a.value);save();renderKeep();};\\n b.oninput=function(){ref.fail=b.value===''?'':parseFloat(b.value);save();renderKeep();};\\n}\\nfunction renderKeep(){var id=document.activeElement&&document.activeElement.id,pos=document.activeElement&&document.activeElement.selectionStart;render();if(id){var e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(pos,pos);}catch(x){}}}}\\nwindow.setScore=function(o){last=o;render();};\\nwindow.run=function(){};\\n})();\\n<\\/script><\\/body><\\/html>\\n\", \"gen\": \"<!DOCTYPE html><html lang=\\\"ko\\\"><head><meta charset=\\\"UTF-8\\\"><meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1\\\">\\n<title>일반고 내신 계산·예측<\\/title>\\n<style>\\n:root{--ink:#1d2433;--sub:#475569;--muted:#8392A6;--ac:var(--tp,#1f6fd1);--bg:#F4F6FB;--line:#E3E8F2}\\n*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,\\\"Apple SD Gothic Neo\\\" olid #f1b4b4;color:#b84a5e}.v-na{background:#eef1f7;border:1px solid #d3dae8;color:#334155}\\ndetails.ref{margin:6px 0 14px}details.ref>summary{cursor:pointer;list-style:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:17.2px;font-weight:800;box-shadow:0 1px 2px rgba(15,42,77,.04)}details.ref>summary::-webkit-details-marker{display:none}details.ref>summary::before{content:\\\"▶ \\\";color:var(--ac);font-size:13.8px}details.ref[open]>summary::before{content:\\\"▼ \\\"}details.ref>summary:hover{border-color:var(--ac)}\\n<\\/style><\\/head><body><div class=\\\"wrap\\\">\\n<div class=\\\"warn\\\"><b>올해 성적 마감일은 11월 30일<\\/b>입니다. 석차는 마감 후 확정되므로, 지금은 <b>예상 석차<\\/b>를 넣어 가늠하고 확정되면 실제 석차로 다시 계산하세요.<\\/div>\\n\\n<div class=\\\"card\\\"><div class=\\\"sh\\\"><span class=\\\"no\\\">1<\\/span><h2>성적 입력<\\/h2><\\/div>\\n<p>교과 성적은 학교 전체 석차와 3학년 재적수로 정해집니다.<\\/p>\\n<div class=\\\"f\\\"><div><label>개인별 석차<\\/label><input type=\\\"number\\\" id=\\\"rk\\\" min=\\\"1\\\" placeholder=\\\"예: 20\\\"><\\/div><div><label>3학년 재적자 수<\\/label><input type=\\\"number\\\" id=\\\"nn\\\" min=\\\"1\\\" placeholder=\\\"예: 200\\\"><\\/div><div class=\\\"mu\\\" id=\\\"cs\\\" style=\\\"padding-bottom:10px\\\"><\\/div><\\/div>\\n<h4>출결 · 봉사 (총점 계산용)<\\/h4>\\n<div class=\\\"f\\\"><div><label>미인정 결석 (일, 3년 합)<\\/label><input type=\\\"number\\\" id=\\\"ab\\\" min=\\\"0\\\" value=\\\"0\\\"><\\/div><div><label>미인정 지각·조퇴·결과 (회, 3년 합)<\\/label><input type=\\\"number\\\" id=\\\"la\\\" min=\\\"0\\\" value=\\\"0\\\" style=\\\"width:170px\\\"><\\/div><div><label>봉사 1학년 (시간)<\\/label><input type=\\\"number\\\" id=\\\"s1\\\" min=\\\"0\\\" value=\\\"10\\\" style=\\\"width:100px\\\"><\\/div><div><label>2학년 (시간)<\\/label><input type=\\\"number\\\" id=\\\"s2\\\" min=\\\"0\\\" value=\\\"10\\\" style=\\\"width:100px\\\"><\\/div><div><label>3학년 (시간)<\\/label><input type=\\\"number\\\" id=\\\"s3\\\" min=\\\"0\\\" value=\\\"10\\\" style=\\\"width:100px\\\"><\\/div><\\/div>\\n<p class=\\\"mu\\\">질병·학교장 인정 결석은 제외합니다. 지각·조퇴·결과 3회 = 결석 1일(2회 이하 버림). 봉사는 학년별 10시간 이상이면 만점입니다.<\\/p><\\/div>\\n\\n<div class=\\\"card\\\"><div class=\\\"sh\\\"><span class=\\\"no\\\">2<\\/span><h2>계산 — 가산점 체크<\\/h2><\\/div>\\n<p>학년별로 해당하는 가산점 사유를 체크하세요(나이스 화면과 같은 방식). 학년당 가산점은 최대 1점입니다.<\\/p>\\n<div class=\\\"g2\\\"><div>\\n<h4>창의적 체험활동 가산점<\\/h4><table class=\\\"nt\\\" id=\\\"t1\\\"><tr><th colspan=\\\"3\\\">학년별 선택<\\/th><th rowspan=\\\"2\\\">가산점사유<\\/th><th rowspan=\\\"2\\\">점수<\\/th><\\/tr><tr><th>1<\\/th><th>2<\\/th><th>3<\\/th><\\/tr><\\/table>\\n<h4>행동특성 가산점<\\/h4><table class=\\\"nt\\\" id=\\\"t2\\\"><tr><th colspan=\\\"3\\\">학년별 선택<\\/th><th rowspan=\\\"2\\\">가산점사유<\\/th><th rowspan=\\\"2\\\">점수<\\/th><\\/tr><tr><th>1<\\/th><th>2<\\/th><th>3<\\/th><\\/tr><\\/table>\\n<button class=\\\"rs\\\" id=\\\"rs\\\">체크 초기화<\\/button><\\/div>\\n<div>\\n<div class=\\\"side\\\"><b class=\\\"t\\\">창체 가산점이 되는 것<\\/b><span class=\\\"ok\\\">인정 (학년당 +1점)<\\/span><ul><li>교내상 수상 1개 → 1점 (개인상, 진로 관련 상)<\\/li><li>학급 회장·부회장, 학생회 서기·부장급 이상 → 1년 1점 / 한 학기 0.5점 (한 학기 미만은 없음)<\\/li><\\/ul><span class=\\\"no\\\">제외<\\/span><ul><li>교과 관련 상, 조별·단체 수상, 자유학년 포트폴리오 우수상<\\/li><li>학급회 차장 등 회장·부회장이 아닌 임원<\\/li><\\/ul><p class=\\\"mu\\\">수상이 있으면 수상으로 입력하고, 없을 때 임원 이력으로 입력합니다. 한 학년에 상이 여러 개여도 하나만 인정합니다.<\\/p><\\/div>\\n<div class=\\\"side\\\" style=\\\"margin-top:10px\\\"><b class=\\\"t\\\">행동특성 가산점이 되는 것<\\/b><span class=\\\"ok\\\">인정 (학년당 +1점)<\\/span><ul><li>모범학생 선행상 부문 → <b>선행상<\\/b><\\/li><li>모범학생 효행상 부문 → <b>효행상<\\/b><\\/li><li>모범학생 봉사상 부문, 환경봉사대 모범학생 부문 → <b>모범상<\\/b> (3학년 환경봉사대 시상 없음)<\\/li><li>선도부 봉사상 부문 → <b>기타수상<\\/b><\\/li><\\/ul><p class=\\\"mu\\\">학교생활기록부에 기재된 교내상(표창장)만 해당합니다.<\\/p><\\/div>\\n<\\/div><\\/div>\\n<h4>계산 결과<\\/h4>\\n<div class=\\\"g2\\\"><div><table id=\\\"r1\\\"><\\/table><\\/div><div><table id=\\\"r2\\\"><\\/table><\\/div><\\/div>\\n<div class=\\\"sc\\\" id=\\\"sc\\\"><\\/div>\\n<div class=\\\"tot\\\" id=\\\"tot\\\">총점을 계산하려면 석차와 재적수를 입력하세요<\\/div><\\/div>\\n\\n<div class=\\\"card\\\"><div class=\\\"sh\\\"><span class=\\\"no\\\">3<\\/span><h2>합격 예측 — 포항동성고<\\/h2><\\/div>\\n<div id=\\\"pv\\\"><\\/div>\\n<h4>기준 점수 (직접 수정 가능)<\\/h4>\\n<div class=\\\"f\\\"><div><label>합격 컷 (점)<\\/label><input type=\\\"number\\\" step=\\\"0.1\\\" id=\\\"c1\\\" value=\\\"210\\\"><\\/div><div><label>기숙사 컷 (점)<\\/label><input type=\\\"number\\\" step=\\\"0.1\\\" id=\\\"c2\\\" value=\\\"270\\\"><\\/div><\\/div>\\n<p class=\\\"mu\\\">담임이 확인한 동성고 자료(합격 컷 210점, 기숙사 270점)를 내신 300점 만점 총점과 비교합니다. 연도별 합격선은 달라질 수 있으니 참고용으로 보세요.<\\/p><\\/div>\\n\\n<details class=\\\"ref\\\"><summary>참고: 일반고 내신 산출 방법 <span class=\\\"mu\\\">(눌러서 펼치기)<\\/span><\\/summary>\\n<div class=\\\"card\\\" style=\\\"margin-top:10px\\\"><h3>내신 총점 300점 구성<\\/h3>\\n<div class=\\\"seg\\\"><div style=\\\"width:80%;background:#1f6fd1\\\">교과 240 (80%)<\\/div><div style=\\\"width:6%;background:#52b79a\\\">출석 18<\\/div><div style=\\\"width:6%;background:#f0a458\\\">봉사 18<\\/div><div style=\\\"width:4%;background:#e582a2\\\">행특 12<\\/div><div style=\\\"width:4%;background:#52b7c9\\\">창체 12<\\/div><\\/div>\\n<h4>교과 240점 — 학교 전체 석차<\\/h4>\\n<p>학기별 성취도 평점(A=5…E=1, 예술·체육 A=5·B=4·C=3) 평균(소수 넷째 자리 반올림)을 6개 학기 합산 → 학교 전체 석차(동점은 3-2, 3-1, 2-2… 순 학기 평점, 그다음 원점수 평균). 성적 없는 학기는 N개 학기 합 × 6/N.<\\/p>\\n<div class=\\\"fm\\\">교과 성적 = 96 + 144 × (1 − 개인별 석차 ÷ 3학년 재적자 수)<\\/div>\\n<p>재적수 10명 이하는 10명 처리, 소수 넷째 자리 반올림 → 셋째 자리까지.<\\/p>\\n<h4>출석 18점 (3개 학년 합산)<\\/h4>\\n<table><tr><th>결석 일수<\\/th><th>0<\\/th><th>1~2<\\/th><th>3~4<\\/th><th>5~6<\\/th><th>7~8<\\/th><th>9~10<\\/th><th>11~12<\\/th><th>13~14<\\/th><th>15~16<\\/th><th>17 이상<\\/th><\\/tr><tr><th>점수<\\/th><td>18<\\/td><td>17<\\/td><td>16<\\/td><td>15<\\/td><td>14<\\/td><td>13<\\/td><td>12<\\/td><td>11<\\/td><td>10<\\/td><td>9<\\/td><\\/tr><\\/table>\\n<h4>봉사활동 18점 (학년당 6점)<\\/h4>\\n<table><tr><th>학년별 봉사 시간<\\/th><th>10시간 이상<\\/th><th>9~6시간<\\/th><th>5시간 이하<\\/th><\\/tr><tr><th>학년당 점수<\\/th><td>6점<\\/td><td>5점<\\/td><td>4점<\\/td><\\/tr><\\/table>\\n<h4>나이스 입력 요령 (가산점)<\\/h4>\\n<ul><li>경로: 나이스 → 자체개발 → 진학 → 내신성적관리 → <b>항목별점수관리<\\/b> (먼저 대상자관리에서 대상자 확정). 창체 → 행동특성 순으로 입력.<\\/li><li>순서: 학생별 등록 → ① 확인 → ② <b>수기입력으로 수정<\\/b> → ③ 선택 → ④ 가산점 사유 기입 → ⑤ 저장. <span style=\\\"color:#cf5f74;font-weight:700\\\">수기입력으로 수정하지 않으면 사유를 입력할 수 없습니다.<\\/span><\\/li><li>수상명은 띄어쓰기 없이, 괄호는 지우고 내용만 붙이며 등급은 괄호 안에 ‘상’을 붙입니다. 예) 통일 문예 대회(운문 부문) 우수(2위) → 통일문예대회운문부문(우수상)<\\/li><li>임원 입력 형식: 학급회장(1년)·학급회장(1학기)·학급회장(2학기)·학급부회장(1년)… 입력 후 출력해 생기부 기록과 일치하는지 확인.<\\/li><li>일정: 11/26(목) 오전까지 입력 → 11/26~27 교차점검 → 11/30(월) 오전 출결 마감, 오후 생기부 확인·가산점 오류 수정 후 반영.<\\/li><\\/ul>\\n<p class=\\\"mu\\\">출처: 2027학년도 고입전형 중학교 내신 성적 산출지침, 고입내신성적 가산점 입력 안내.<\\/p><\\/div>\\n<\\/details>\\n<\\/div>\\n<script>\\n(function(){\\nvar $=function(i){return document.getElementById(i);};\\nvar D={t1:[['학급(부)실장-1년',1],['학급(부)실장-한학기',.5],['학생회임원-1년',1],['학생회임원-한학기',.5],['창체관련수상',1]],t2:[['선행상',1],['효행상',1],['모범상',1],['기타수상(행동특성관련)',1]]};\\nvar ST={t1:{},t2:{}},K='gen_ref';\\nfunction build(id){var h='';D[id].forEach(function(r,i){h+='<tr data-i=\\\"'+i+'\\\">';[1,2,3].forEach(function(y){h+='<td><input type=\\\"checkbox\\\" data-t=\\\"'+id+'\\\" data-i=\\\"'+i+'\\\" data-y=\\\"'+y+'\\\"><\\/td>';});h+='<td class=\\\"l\\\">'+r[0]+'<\\/td><td class=\\\"pt\\\">'+r[1].toFixed(2)+'<\\/td><\\/tr>';});$(id).insertAdjacentHTML('beforeend',h);}\\nfunction f2(x){return x.toFixed(2);}function f1(x){return x.toFixed(1);}\\nfunction sum(id){return [1,2,3].map(function(y){var s=0,n=0;D[id].forEach(function(r,i){if(ST[id][i+'|'+y]){s+=r[1];n++;}});return {raw:s,n:n,add:Math.min(1,s)};});}\\nfunction res(id,a,el){var h='<tr><th>학년<\\/th><th>선택 합계<\\/th><th>인정 가산점<\\/th><th>학년 점수(4점)<\\/th><\\/tr>',t=0;a.forEach(function(r,i){t+=r.add;h+='<tr><td>'+(i+1)+'학년<\\/td><td>'+(r.n?f2(r.raw):'-')+'<\\/td><td><b>'+f2(r.add)+'<\\/b>'+(r.raw>1?' <span class=\\\"mu\\\">(한도 1점)<\\/span>':'')+'<\\/td><td>'+f2(3+r.add)+'<\\/td><\\/tr>';});h+='<tr><th colspan=\\\"2\\\">'+el+' 합계<\\/th><th>'+f2(t)+'<\\/th><th>'+f2(9+t)+' / 12<\\/th><\\/tr>';return {h:h,t:t};}\\nfunction num(id){var v=parseFloat($(id).value);return isNaN(v)?null:v;}\\nvar CUT={c1:210,c2:270};try{var q=JSON.parse(localStorage.getItem(K)||'null');if(q){CUT=q;$('c1').value=q.c1;$('c2').value=q.c2;}}catch(e){}\\nfunction calc(){\\n var a=sum('t1'),b=sum('t2'),r1=res('t1',a,'창체'),r2=res('t2',b,'행동특성');$('r1').innerHTML=r1.h;$('r2').innerHTML=r2.h;\\n document.querySelectorAll('.nt tr[data-i]').forEach(function(tr){var id=tr.parentNode.parentNode.id,on=[1,2,3].some(function(y){return ST[id][tr.dataset.i+'|'+y];});tr.classList.toggle('sel',on);});\\n var rk=num('rk'),nn=num('nn'),sub=null;\\n if(rk>0&&nn>0){var N=Math.max(10,nn);if(rk>N&&nn>=10){$('cs').textContent='석차는 재적수 이하여야 합니다';}else{sub=Math.round((96+144*(1-rk/N))*1000)/1000;$('cs').innerHTML='교과 점수 <b style=\\\"color:#1f6fd1\\\">'+sub.toFixed(3)+' / 240점<\\/b>';}}else $('cs').textContent='';\\n var days=(num('ab')||0)+Math.floor((num('la')||0)/3),att=days<=0?18:days<=2?17:days<=4?16:days<=6?15:days<=8?14:days<=10?13:days<=12?12:days<=14?11:days<=16?10:9;\\n var sv=0;['s1','s2','s3'].forEach(function(i){var h=num(i)||0;sv+=h>=10?6:h>=6?5:4;});\\n var hb=9+r2.t,cc=9+r1.t;\\n $('sc').innerHTML=[['교과',sub===null?'-':f1(sub)+' / 240'],['출석',att+' / 18'],['봉사',sv+' / 18'],['행동특성',f2(hb)+' / 12'],['창체',f2(cc)+' / 12']].map(function(x){return '<div><small>'+x[0]+'<\\/small><b>'+x[1]+'<\\/b><\\/div>';}).join('');\\n var total=sub===null?null:sub+att+sv+hb+cc;\\n $('tot').innerHTML=total===null?'총점을 계산하려면 석차와 재적수를 입력하세요':'내신 총점 <span style=\\\"color:#1f6fd1\\\">'+total.toFixed(3)+'<\\/span> <span class=\\\"mu\\\" style=\\\"font-weight:600\\\">/ 300점<\\/span>';\\n predict(total);\\n}\\nfunction predict(t){\\n var c1=num('c1'),c2=num('c2'),h='';\\n if(t===null){h='<div class=\\\"verdict v-na\\\"><div class=\\\"t\\\">포항동성고 · 예측<\\/div><div class=\\\"v\\\">성적 입력 필요<\\/div><div class=\\\"d\\\">①에서 석차와 재적수를 입력하면 예측이 표시됩니다.<\\/div><\\/div>';}\\n else{var cls,head,d;\\n  if(c2!==null&&t>=c2){cls='v-hi';head='합격권 · 기숙사 가능권';d='예상 총점 '+t.toFixed(1)+'점이 기숙사 컷 '+c2+'점 이상입니다.';}\\n  else if(c1!==null&&t>=c1){cls='v-mid';head='합격권 · 기숙사는 어려움';d='예상 총점 '+t.toFixed(1)+'점이 합격 컷 '+c1+'점 이상이지만 기숙사 컷 '+(c2===null?'':c2+'점보다 '+(c2-t).toFixed(1)+'점 낮습니다.');}\\n  else if(c1!==null){cls='v-lo';head='합격 어려움';d='예상 총점 '+t.toFixed(1)+'점이 합격 컷 '+c1+'점보다 '+(c1-t).toFixed(1)+'점 낮습니다.';}\\n  else{cls='v-na';head='기준 점수 없음';d='아래에 합격 컷을 입력하세요.';}\\n  h='<div class=\\\"verdict '+cls+'\\\"><div class=\\\"t\\\">포항동성고 · 예측<\\/div><div class=\\\"v\\\">'+head+'<\\/div><div class=\\\"d\\\">'+d+'<\\/div><\\/div>';\\n  var m=300,p=function(x){return Math.min(100,x/m*100);};\\n  h+='<div class=\\\"bar\\\"><i style=\\\"width:'+p(t)+'%\\\"><\\/i>'+(c1!==null?'<u style=\\\"left:'+p(c1)+'%;background:#f0a458\\\"><\\/u><b style=\\\"left:'+p(c1)+'%;color:#b45309\\\">합격 '+c1+'<\\/b>':'')+(c2!==null?'<u style=\\\"left:'+p(c2)+'%;background:#3f9d6e\\\"><\\/u><b style=\\\"left:'+p(c2)+'%;color:#3f9d6e;top:-40px\\\">기숙사 '+c2+'<\\/b>':'')+'<\\/div><div class=\\\"ax\\\"><span>0<\\/span><span>150<\\/span><span>300<\\/span><\\/div>';}\\n $('pv').innerHTML=h;\\n}\\nbuild('t1');build('t2');\\ndocument.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.t){ST[t.dataset.t][t.dataset.i+'|'+t.dataset.y]=t.checked;calc();}});\\ndocument.addEventListener('input',function(e){if(e.target.type==='number'){if(e.target.id==='c1'||e.target.id==='c2'){CUT={c1:num('c1'),c2:num('c2')};try{localStorage.setItem(K,JSON.stringify(CUT));}catch(x){}}calc();}});\\n$('rs').onclick=function(){ST={t1:{},t2:{}};document.querySelectorAll('.nt input').forEach(function(c){c.checked=false;});calc();};\\ncalc();window.run=function(){};window.setScore=function(){};\\n})();\\n<\\/script><\\/body><\\/html>\\n\", \"hs\": \"<!DOCTYPE html><html lang=\\\"ko\\\"><head><meta charset=\\\"UTF-8\\\"><meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1\\\">\\n<title>포항 일반고 정보<\\/title>\\n<st
